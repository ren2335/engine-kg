<script id="payload" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const DATA=JSON.parse(document.getElementById("payload").textContent);
const N=DATA.nodes, E=DATA.edges, LAYN=DATA.layerNames;

/* ---- colours ---- */
const SUBCOLOR={General:"#7d8d9a",Compression:"#3fb6ff",Combustion:"#ff7a4d",
  Expansion:"#5fd38a",Exhaust:"#c08bff",Cycle:"#ffb454"};
const SUBPAL=["#3fb6ff","#ff7a4d","#5fd38a","#c08bff","#ffb454","#33d6c4","#ff6a9c","#9aa7ff"];
DATA.subs.forEach((s,i)=>{ if(!SUBCOLOR[s]) SUBCOLOR[s]=SUBPAL[i%SUBPAL.length]; });
SUBCOLOR.General="#7d8d9a";
const subColor=n=>SUBCOLOR[n.sub]||"#7d8d9a";
const SEM={propagation:getCss("--prop"),usage:getCss("--usage"),constraint:getCss("--constraint"),
  coupling:getCss("--coupling"),structure:getCss("--structure"),membership:getCss("--member")};
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ---- adjacency ---- */
const outAdj=N.map(()=>[]),inAdj=N.map(()=>[]),nbr=N.map(()=>new Set());
E.forEach((e,i)=>{outAdj[e.s].push(i);inAdj[e.t].push(i);nbr[e.s].add(e.t);nbr[e.t].add(e.s);});

/* ---- state ---- */
const FACET_LABELS={lab:"节点类型 / 层",sub:"子系统 SUBSYSTEM",physics_domain:"物理域",network_level:"网络层级",knowledge_domain:"知识域",importance:"重要度"};
const FACET_ORDER=["lab","sub","physics_domain","network_level","importance","knowledge_domain"];
const facetSel={}; FACET_ORDER.forEach(k=>{if(DATA.facets[k])facetSel[k]=new Set();});
const relSel=new Set();
let query="",selected=-1,hover=-1,chainSet=null;
let showSubsystem=true, showDerivedEdges=true;

const maxDeg=Math.max(1,...N.map(n=>n.deg));
const radius=n=> n.der? 11 : 4+6.5*Math.sqrt(n.deg/maxDeg);

/* ---- visibility ---- */
let visNode=new Uint8Array(N.length), visEdge=new Uint8Array(E.length), matchNode=new Uint8Array(N.length), visibleCount=0;
function facetVal(n,k){return k==="lab"?n.lab : k==="sub"?n.sub : n.p[k];}
function passFacets(n){for(const k in facetSel){const s=facetSel[k];if(!s.size)continue;
  if(!s.has(String(facetVal(n,k))))return false;}return true;}
function matchesQuery(n){if(!query)return true;
  return (n.name+" "+(n.p.knowledge_domain||"")+" "+(n.p.description||"")+" "+n.sub+" "+(n.p.physics_domain||"")).toLowerCase().indexOf(query)>=0;}
function recompute(){
  visibleCount=0;
  for(let i=0;i<N.length;i++){const n=N[i];
    let ok = passFacets(n) && matchesQuery(n);
    if(n.der && !showSubsystem) ok=false;
    matchNode[i]=matchesQuery(n)?1:0;
    visNode[i]=ok?1:0; if(ok)visibleCount++;
  }
  for(let i=0;i<E.length;i++){const e=E[i];
    let ok = (relSel.size===0||relSel.has(e.r)) && visNode[e.s] && visNode[e.t];
    if(e.der && (!showDerivedEdges||!showSubsystem)) ok=false;
    visEdge[i]=ok?1:0;
  }
  document.getElementById("empty").style.display=visibleCount?"none":"flex";
}

/* ============================================================ CANVAS */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
const DPR=Math.min(window.devicePixelRatio||1,2);
let view={x:0,y:0,s:1},W=0,H=0;
function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw();}
const W2S=(x,y)=>[x*view.s+view.x,y*view.s+view.y];
const S2W=(px,py)=>[(px-view.x)/view.s,(py-view.y)/view.s];

function fit(){
  let a=1e9,b=1e9,c=-1e9,d=-1e9,any=false;
  for(let i=0;i<N.length;i++){if(!visNode[i])continue;any=true;const n=N[i];
    if(n.x<a)a=n.x;if(n.y<b)b=n.y;if(n.x>c)c=n.x;if(n.y>d)d=n.y;}
  if(!any){a=0;b=0;c=2240;d=600;}
  const padX=80,padTop=70,padB=40,w=Math.max(1,c-a),h=Math.max(1,d-b);
  view.s=Math.max(.03,Math.min((W-2*padX)/w,(H-padTop-padB)/h,2.5));
  view.x=(W-(a+c)*view.s)/2; view.y=(H+padTop-padB-(b+d)*view.s)/2; draw();
}
function isChain(i){return chainSet&&chainSet.has(i);}
function focusActive(){return selected>=0||hover>=0||!!chainSet;}
function inFocus(i){
  if(chainSet)return chainSet.has(i);
  const f=selected>=0?selected:hover;
  if(f<0)return false; return i===f||nbr[f].has(i);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawColumns();
  const focus=focusActive(),fn=selected>=0?selected:hover;

  /* edges (bezier) */
  for(let i=0;i<E.length;i++){
    if(!visEdge[i])continue;
    const e=E[i],a=N[e.s],b=N[e.t];
    const [ax,ay]=W2S(a.x,a.y),[bx,by]=W2S(b.x,b.y);
    let hot=false;
    if(chainSet){ hot=chainSet.has(e.s)&&chainSet.has(e.t); }
    else if(focus){ hot=(e.s===fn||e.t===fn); }
    let col=SEM[e.sem]||"#46627c", alpha;
    if(focus&&!hot){ alpha=.05; }
    else if(hot){ alpha=.95; }
    else { alpha = query&&(!matchNode[e.s]||!matchNode[e.t])?.08:(e.der?.18:.3); }
    ctx.globalAlpha=alpha; ctx.strokeStyle=col;
    ctx.lineWidth=hot?2:1;
    if(e.der){ ctx.setLineDash([4,4]); } else if(e.sem==="coupling"){ ctx.setLineDash([5,3]); } else ctx.setLineDash([]);
    bezier(ax,ay,bx,by);
    ctx.stroke(); ctx.setLineDash([]);
    if((hot||(focus&&!chainSet&&!hot===false)) && view.s>0.22 && !e.der) arrow(ax,ay,bx,by,radius(b)*view.s);
  }
  ctx.globalAlpha=1;

  /* nodes */
  const labelOn=document.getElementById("optLabels").checked;
  for(let i=0;i<N.length;i++){
    if(!visNode[i])continue;
    const n=N[i],[x,y]=W2S(n.x,n.y),r=Math.max(2.2,radius(n)*view.s);
    let alpha=1;
    if(focus&&!inFocus(i)) alpha=.12;
    else if(query&&!matchNode[i]) alpha=.2;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=subColor(n);
    if(n.der){ // subsystem hub -> diamond
      ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y);ctx.closePath();
      ctx.fill(); ctx.lineWidth=1.4;ctx.strokeStyle="rgba(255,255,255,.5)";ctx.stroke();
    } else {
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();
    }
    if(i===selected){ctx.lineWidth=2.5;ctx.strokeStyle="#fff";ctx.stroke();}
    else if(i===hover){ctx.lineWidth=2;ctx.strokeStyle=getCss("--hot");ctx.stroke();}
    ctx.globalAlpha=1;
  }

  /* labels */
  ctx.font="11px "+getCss("--mono");ctx.textBaseline="middle";
  for(let i=0;i<N.length;i++){
    if(!visNode[i])continue;
    const n=N[i],r=Math.max(2.2,radius(n)*view.s);
    const show=(i===selected)||(i===hover)||(focus&&inFocus(i))||n.der||(labelOn&&(view.s>0.5||r>8));
    if(!show)continue; if(focus&&!inFocus(i))continue;
    const [x,y]=W2S(n.x,n.y);
    const t=n.name.length>30?n.name.slice(0,29)+"…":n.name;
    ctx.lineWidth=3;ctx.strokeStyle="rgba(7,11,16,.92)";
    ctx.textAlign=n.der?"right":"left"; const ox=n.der?-(r+5):(r+5);
    ctx.strokeText(t,x+ox,y);
    ctx.fillStyle=(i===selected||i===hover)?"#fff":(n.der?"#cfe0ee":"#bccadb");
    ctx.fillText(t,x+ox,y);
  }
  ctx.textAlign="left";
  document.getElementById("zlabel").textContent=Math.round(view.s*100)+"%";
}
function bezier(ax,ay,bx,by){
  ctx.beginPath();ctx.moveTo(ax,ay);
  if(Math.abs(bx-ax)<1){ const off=40*view.s+Math.abs(by-ay)*.18;
    ctx.bezierCurveTo(ax+off,ay,bx+off,by,bx,by); }
  else { const mx=(ax+bx)/2; ctx.bezierCurveTo(mx,ay,mx,by,bx,by); }
}
function arrow(ax,ay,bx,by,rb){
  // tangent at the curve end ≈ from horizontal control point (midX,by) to end (bx,by)
  let dx=bx-(ax+bx)/2, dy=0, L=Math.hypot(dx,dy)||1;
  const ux=dx/L,uy=dy/L,ex=bx-ux*(rb+2),ey=by-uy*(rb+2),sz=6;
  ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();
  ctx.moveTo(ex,ey);ctx.lineTo(ex-ux*sz-uy*sz*.55,ey-uy*sz+ux*sz*.55);
  ctx.lineTo(ex-ux*sz+uy*sz*.55,ey-uy*sz-ux*sz*.55);ctx.closePath();ctx.fill();
}
function drawColumns(){
  // layer band + header per column, in world space
  const cols={};
  for(let i=0;i<N.length;i++){ if(!visNode[i])continue; const L=N[i].layer;
    if(!cols[L])cols[L]={x:N[i].x,minY:N[i].y,maxY:N[i].y}; else{cols[L].minY=Math.min(cols[L].minY,N[i].y);cols[L].maxY=Math.max(cols[L].maxY,N[i].y);} }
  ctx.textAlign="center";ctx.textBaseline="alphabetic";
  for(const L in cols){
    const c=cols[L],[cx,top]=W2S(c.x,c.minY);
    // header
    ctx.font="600 13px "+getCss("--mono");ctx.fillStyle="rgba(180,200,216,.5)";
    ctx.fillText((LAYN[L]||("L"+L)).toUpperCase(), cx, top-26);
    ctx.font="10px "+getCss("--mono");ctx.fillStyle="rgba(120,140,156,.45)";
    ctx.fillText("layer "+L, cx, top-13);
  }
  ctx.textAlign="left";ctx.textBaseline="middle";
}

/* ---- hit testing ---- */
function pick(px,py){let best=-1,bd=1e9;
  for(let i=0;i<N.length;i++){if(!visNode[i])continue;const n=N[i],[x,y]=W2S(n.x,n.y);
    const r=Math.max(5,radius(n)*view.s)+3,d=(x-px)*(x-px)+(y-py)*(y-py);
    if(d<=r*r&&d<bd){bd=d;best=i;}}return best;}

/* ---- interaction: drag node OR pan, wheel zoom ---- */
let mode=null,moved=false,lastX=0,lastY=0,dragNode=-1,dragOff=[0,0];
cv.addEventListener("mousedown",e=>{
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const h=pick(px,py); moved=false; lastX=e.clientX; lastY=e.clientY;
  if(h>=0){ mode="node"; dragNode=h; const [wx,wy]=S2W(px,py); dragOff=[N[h].x-wx,N[h].y-wy]; cv.classList.add("draggingnode"); }
  else { mode="pan"; cv.classList.add("panning"); }
});
window.addEventListener("mouseup",e=>{
  if(mode==="node"&&!moved){ select(dragNode); }
  else if(mode==="pan"&&!moved){ deselect(); }
  mode=null;dragNode=-1;cv.classList.remove("panning");cv.classList.remove("draggingnode");
});
cv.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  if(mode==="node"){ const dx=e.clientX-lastX,dy=e.clientY-lastY; if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    const [wx,wy]=S2W(px,py); N[dragNode].x=wx+dragOff[0]; N[dragNode].y=wy+dragOff[1]; draw(); hideTip(); return; }
  if(mode==="pan"){ const dx=e.clientX-lastX,dy=e.clientY-lastY; if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    view.x+=dx;view.y+=dy;lastX=e.clientX;lastY=e.clientY;draw();hideTip();return; }
  const h=pick(px,py); if(h!==hover){hover=h;if(!chainSet)draw();}
  if(h>=0)showTip(e.clientX,e.clientY,N[h]); else hideTip();
});
cv.addEventListener("mouseleave",()=>{if(hover>=0){hover=-1;if(!chainSet)draw();}hideTip();});
cv.addEventListener("wheel",e=>{e.preventDefault();const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const [wx,wy]=S2W(px,py),f=Math.exp(-e.deltaY*0.0012); view.s=Math.max(.03,Math.min(view.s*f,6));
  view.x=px-wx*view.s;view.y=py-wy*view.s;draw();hideTip();},{passive:false});

const tip=document.getElementById("tip");
function showTip(cx,cy,n){tip.style.display="block";
  tip.innerHTML="<b style='color:"+subColor(n)+"'>"+esc(n.name)+"</b><br>"+esc(n.lab)+" · "+esc(n.sub)+" · deg "+n.deg;
  const r=stage.getBoundingClientRect();tip.style.left=(cx-r.left+14)+"px";tip.style.top=(cy-r.top+14)+"px";}
function hideTip(){tip.style.display="none";}

function zoomBtn(f){const px=W/2,py=H/2,[wx,wy]=S2W(px,py);view.s=Math.max(.03,Math.min(view.s*f,6));view.x=px-wx*view.s;view.y=py-wy*view.s;draw();}

/* ============================================================ DETAIL + CHAIN */
const detail=document.getElementById("detail");
function select(i){selected=i;hover=-1;chainSet=null;renderDetail(N[i]);detail.classList.add("open");draw();}
function deselect(){selected=-1;chainSet=null;detail.classList.remove("open");draw();}
document.getElementById("dclose").onclick=deselect;
document.getElementById("chainbtn").onclick=()=>{ if(selected<0)return; buildChain(selected); draw(); };

function buildChain(start){
  const set=new Set([start]);
  // downstream via outgoing real edges
  let stack=[start];
  while(stack.length){const u=stack.pop();
    for(const ei of outAdj[u]){const e=E[ei]; if(e.der)continue; if(!set.has(e.t)){set.add(e.t);stack.push(e.t);}}}
  // upstream via incoming real edges
  stack=[start];
  while(stack.length){const u=stack.pop();
    for(const ei of inAdj[u]){const e=E[ei]; if(e.der)continue; if(!set.has(e.s)){set.add(e.s);stack.push(e.s);}}}
  chainSet=set;
}

function renderDetail(n){
  const c=subColor(n),bd=document.getElementById("dbadge");
  bd.textContent=n.lab+(n.der?" · 派生":"");bd.style.background=c;
  const sb=document.getElementById("dsub");sb.textContent=n.sub;sb.style.background="#26323d";sb.style.color="#cfe0ee";
  document.getElementById("dname").textContent=n.name;
  const dd=document.getElementById("ddesc");
  if(n.p.description){dd.style.display="block";document.getElementById("ddesctext").textContent=n.p.description;}else dd.style.display="none";
  const order=["id","subsystem","knowledge_domain","physics_domain","network_level","importance"];
  const L={id:"ID",subsystem:"子系统",knowledge_domain:"知识域",physics_domain:"物理域",network_level:"网络层级",importance:"重要度"};
  let kv="";order.forEach(k=>{const v=k==="subsystem"?n.sub:n.p[k];if(v!==undefined&&v!=="")kv+="<div class='k'>"+L[k]+"</div><div class='v'>"+esc(String(v))+"</div>";});
  kv+="<div class='k'>ontology</div><div class='v'>"+esc(LAYN[n.layer]||"")+" (L"+n.layer+")</div>";
  kv+="<div class='k'>degree</div><div class='v'>"+n.deg+"</div>";
  document.getElementById("dprops").innerHTML=kv;
  const out=outAdj[n.i],inc=inAdj[n.i];
  document.getElementById("douth").textContent="出向传播 OUT → ("+out.length+")";
  document.getElementById("dinh").textContent="入向来源 IN ← ("+inc.length+")";
  document.getElementById("dout").innerHTML=relRows(out,true);
  document.getElementById("din").innerHTML=relRows(inc,false);
  detail.scrollTop=0;
}
function relRows(eids,isOut){
  if(!eids.length)return "<div style='color:var(--faint)'>—</div>";
  return eids.map(ei=>{const e=E[ei],o=N[isOut?e.t:e.s],col=SEM[e.sem]||"#888";
    return "<div class='rel' data-i='"+o.i+"'><span class='sw' style='background:"+subColor(o)+"'></span>"+
      "<span class='arr' style='color:"+col+"'>"+(isOut?"→ ":"← ")+esc(e.r)+"</span>"+
      "<span class='nm'>"+esc(o.name)+"</span></div>";}).join("");
}
detail.addEventListener("click",e=>{const row=e.target.closest(".rel");if(row)select(parseInt(row.dataset.i,10));});

/* ============================================================ SIDEBAR */
function buildSidebar(){
  const side=document.getElementById("side");let h="";
  h+="<div class='toolbar'><button id='reset'>重置筛选</button><button id='fit2'>适配视图</button></div>";
  h+="<label class='chk'><input type='checkbox' id='optLabels'> 显示全部标签</label>";
  h+="<label class='chk'><input type='checkbox' id='optSub' checked> 显示子系统层 (派生)</label>";
  h+="<label class='chk'><input type='checkbox' id='optDer' checked> 显示派生归属边</label>";
  FACET_ORDER.forEach(key=>{const f=DATA.facets[key];if(!f)return;
    const ent=Object.entries(f).sort((a,b)=>b[1]-a[1]),many=ent.length>12,open=(key==="lab"||key==="sub")?"":(many?" closed":"");
    h+="<div class='facet"+open+"' data-k='"+key+"'><h4><span class='car'>▾</span>"+FACET_LABELS[key]+" <span style='color:var(--faint);font-weight:400'>("+ent.length+")</span></h4><div class='body'>";
    if(many)h+="<input class='mini' placeholder='过滤…' data-fk='"+key+"'>";
    ent.forEach(([val,ct])=>{const sw=key==="sub"?"<span class='sw' style='background:"+(SUBCOLOR[val]||'#888')+"'></span>":"";
      h+="<label class='opt' data-fk='"+key+"' data-v='"+escA(val)+"'><input type='checkbox'>"+sw+"<span class='nm' title='"+escA(val)+"'>"+esc(val)+"</span><span class='ct'>"+ct+"</span></label>";});
    h+="</div></div>";});
  // relation types
  h+="<div class='facet closed' data-k='__rel'><h4><span class='car'>▾</span>关系类型 RELATIONS <span style='color:var(--faint);font-weight:400'>("+DATA.relTypes.length+")</span></h4><div class='body'><input class='mini' placeholder='过滤…' data-fk='__rel'>";
  DATA.relTypes.forEach(rt=>{h+="<label class='opt' data-fk='__rel' data-v='"+escA(rt)+"'><input type='checkbox'><span class='nm' title='"+escA(rt)+"'>"+esc(rt)+"</span></label>";});
  h+="</div></div>";
  side.innerHTML=h;
  side.querySelectorAll(".facet h4").forEach(x=>x.onclick=()=>x.parentElement.classList.toggle("closed"));
  side.querySelectorAll(".opt").forEach(opt=>opt.addEventListener("click",ev=>{
    if(ev.target.tagName!=="INPUT"){const b=opt.querySelector("input");b.checked=!b.checked;}
    const k=opt.dataset.fk,v=opt.dataset.v,on=opt.querySelector("input").checked,set=k==="__rel"?relSel:facetSel[k];
    on?set.add(v):set.delete(v);apply();}));
  side.querySelectorAll(".mini").forEach(inp=>inp.addEventListener("input",()=>{const qq=inp.value.toLowerCase(),k=inp.dataset.fk;
    side.querySelectorAll(".opt[data-fk='"+CSS.escape(k)+"']").forEach(o=>o.style.display=o.dataset.v.toLowerCase().indexOf(qq)>=0?"":"none");}));
  document.getElementById("reset").onclick=resetFilters;
  document.getElementById("fit2").onclick=()=>{chainSet=null;fit();};
  document.getElementById("optLabels").addEventListener("change",draw);
  document.getElementById("optSub").addEventListener("change",e=>{showSubsystem=e.target.checked;apply();});
  document.getElementById("optDer").addEventListener("change",e=>{showDerivedEdges=e.target.checked;apply();});
}
function resetFilters(){for(const k in facetSel)facetSel[k].clear();relSel.clear();query="";chainSet=null;
  document.getElementById("q").value="";document.getElementById("qx").style.display="none";
  document.querySelectorAll(".opt input").forEach(b=>b.checked=false);apply();fit();}

function buildLegend(){
  const subs=DATA.subs.map(s=>"<div class='row'><span class='sw' style='background:"+(SUBCOLOR[s]||'#888')+"'></span>"+esc(s)+"</div>").join("");
  const sem=[["传播 AFFECTS","--prop"],["进入方程 USED_IN","--usage"],["约束 LIMITED_BY","--constraint"],["耦合 COUPLED","--coupling"],["结构 INCLUDES","--structure"],["归属(派生)","--member"]]

  const s=DATA.stats;

}

/* ============================================================ TABLE */
let sortKey="layer",sortDir=1;
function buildTable(){
  const cols=[["name","名称"],["lab","层/类型"],["sub","子系统"],["physics_domain","物理域"],["network_level","网络层级"],["knowledge_domain","知识域"],["deg","度"],["description","描述"]];
  const rows=[];for(let i=0;i<N.length;i++)if(visNode[i]&&!N[i].der)rows.push(N[i]);
  const gv=(n,k)=>k==="name"?n.name:k==="lab"?n.layer:k==="sub"?n.sub:k==="deg"?n.deg:(n.p[k]??"");
  rows.sort((a,b)=>{let va=gv(a,sortKey),vb=gv(b,sortKey);
    if(typeof va==="number"&&typeof vb==="number")return (va-vb)*sortDir;
    return String(va).localeCompare(String(vb),"zh")*sortDir;});
  let h="<table><thead><tr>";cols.forEach(([k,l])=>{const ar=k===sortKey?(sortDir>0?" ▲":" ▼"):"";h+="<th data-k='"+k+"'>"+l+"<span class='ar'>"+ar+"</span></th>";});
  h+="</tr></thead><tbody>";
  rows.forEach(n=>{h+="<tr data-i='"+n.i+"'><td>"+esc(n.name)+"</td>"+
    "<td><span class='pill' style='background:"+subColor(n)+"'>"+esc(n.lab)+"</span></td>"+
    "<td>"+esc(n.sub)+"</td><td>"+esc(n.p.physics_domain||"")+"</td>"+
    "<td class='num'>"+esc(String(n.p.network_level??""))+"</td><td>"+esc(n.p.knowledge_domain||"")+"</td>"+
    "<td class='num'>"+n.deg+"</td><td class='tdesc'>"+esc((n.p.description||"").slice(0,140))+"</td></tr>";});
  h+="</tbody></table>";const w=document.getElementById("tablewrap");w.innerHTML=h;
  w.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortKey)sortDir=-sortDir;else{sortKey=k;sortDir=(k==="deg")?-1:1;}buildTable();});
  w.querySelectorAll("tr[data-i]").forEach(tr=>tr.onclick=()=>{const i=+tr.dataset.i;showGraph();select(i);centerNode(i);});
}
function centerNode(i){const n=N[i];view.s=Math.max(view.s,.9);view.x=W/2-n.x*view.s;view.y=H/2-n.y*view.s;draw();}

const tablewrap=document.getElementById("tablewrap");
function showGraph(){tablewrap.style.display="none";document.getElementById("vGraph").classList.add("on");document.getElementById("vTable").classList.remove("on");draw();}
