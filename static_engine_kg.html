    edges: edges

};

var network =
new vis.Network(
container,
data,
options
);

function searchNode() {

    var keyword =
    document.getElementById(
    "searchBox"
    ).value.toLowerCase();

    var found = null;

    nodes.forEach(function(node) {

        if(node.label.toLowerCase()
        .includes(keyword)) {

            found = node.id;

        }

    });

    if(found) {

        network.focus(found, {

            scale:1.6,

            animation:true

        });

        network.selectNodes([found]);

    }

}

function filterGroup() {

    var group =
    document.getElementById(
    "groupFilter"
    ).value;

    if(group === "ALL") {

        nodes.forEach(function(node) {

            nodes.update({

                id: node.id,
                hidden:false

            });

        });

        return;

    }

    nodes.forEach(function(node) {

        if(node.group === group) {

            nodes.update({

                id: node.id,
                hidden:false

            });

        }

        else {

            nodes.update({

                id: node.id,
                hidden:true

            });

        }

    });

}

function resetGraph() {

    nodes.forEach(function(node) {

        nodes.update({

            id: node.id,
            hidden:false

        });

    });

    network.fit();

}
