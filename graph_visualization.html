<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>知识图谱离线可视化交互系统</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; height: 100vh; background-color: #f4f6f9; color: #333; }
        
        /* 左侧控制台 */
        #sidebar { width: 320px; background-color: #ffffff; border-right: 1px solid #e0e4ec; display: flex; flex-direction: column; box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 10; }
        .panel-section { padding: 20px; border-bottom: 1px solid #e0e4ec; }
        h3 { margin-bottom: 12px; font-size: 15px; color: #1e293b; letter-spacing: 0.5px; }
        .search-input, .select-input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 14px; transition: border 0.2s; }
        .search-input:focus, .select-input:focus { border-color: #3b82f6; }
        
        /* 属性详情页 */
        #details-panel { flex: 1; overflow-y: auto; padding: 20px; background-color: #f8fafc; }
        .prop-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .prop-table th, .prop-table td { text-align: left; padding: 8px; border-bottom: 1px solid #e2e8f0; }
        .prop-table th { color: #64748b; font-weight: 500; width: 35%; }
        .prop-table td { color: #0f172a; word-break: break-all; }

        /* 右侧画布区域 */
        #canvas-container { flex: 1; position: relative; height: 100%; }
        #network-canvas { width: 100%; height: 100%; background-color: #fafbfc; }
        
        /* 统计加载提示 */
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; background: rgba(0,0,0,0.75); color: #fff; border-radius: 8px; font-size: 14px; pointer-events: none; transition: opacity 0.3s; z-index: 100; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="panel-section">
            <h2 style="font-size: 18px; color: #2563eb; margin-bottom: 4px;">知识图谱数据看板</h2>
            <p style="font-size: 12px; color: #64748b;">数据源: Neo4j Aura 离线导出</p>
        </div>
        
        <div class="panel-section">
            <h3>搜索节点名称</h3>
            <input type="text" id="search-box" class="search-input" placeholder="输入关键字实时检索..." oninput="filterGraph()">
        </div>
        <div class="panel-section">
            <h3>按节点标签 (Label) 过滤</h3>
            <select id="label-filter" class="select-input" onchange="filterGraph()">
                <option value="">全部标签</option>
            </select>
        </div>
        <div class="panel-section">
            <h3>按知识领域 (Domain) 过滤</h3>
            <select id="domain-filter" class="select-input" onchange="filterGraph()">
                <option value="">全部领域</option>
            </select>
        </div>

        <div id="details-panel">

            </div>
            <div id="details-content" style="display: none;">
                <h2 id="detail-title" style="font-size: 18px; color: #1e3a8a; margin-bottom: 5px;"></h2>
                <span id="detail-group" style="display: inline-block; padding: 2px 8px; background: #dbeafe; color: #1e40af; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 15px;"></span>
                <table class="prop-table" id="detail-table"></table>
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <div id="loading">正在进行拓扑布局优化，请稍候...</div>
        <div id="network-canvas"></div>
    </div>

,\n  description: Stagnation temperature (or total temperature) T_t represents the temperature achieved when a fluid is decelerated to zero velocity adiabatically.,\n  subsystem: General,\n  id: 36,\n  physics_domain: Thermodynamics\n}"}}, {"id": "386", "label": "ID_386", "group": "Parameter", "domain": "未分类", "title": "<b>ID_386</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Fanno flow,\n  description: Fanno flow refers to adiabatic flow in a constant-area duct with friction.,\n  subsystem: General,\n  id: 45,\n  physics_domain: FluidDynamics\n}"}}, {"id": "542.0", "label": "ID_542.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_542.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Constant area flow with friction,\n  description: Fanno flow refers to adiabatic flow in a constant-area duct with friction.,\n  subsystem: General,\n  id: 201,\n  physics_domain: FluidDynamics\n}"}}, {"id": "543.0", "label": "ID_543.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_543.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Unity,\n  description: Friction always drives the Mach number toward unity in Fanno flow, whether the inlet flow is subsonic or supersonic.,\n  subsystem: General,\n  id: 202,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "387", "label": "ID_387", "group": "Parameter", "domain": "未分类", "title": "<b>ID_387</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Rayleigh flow,\n  description: Rayleigh flow refers to frictionless flow in a constant-area duct with heat transfer (heating or cooling).,\n  subsystem: General,\n  id: 46,\n  physics_domain: FluidDynamics\n}"}}, {"id": "544.0", "label": "ID_544.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_544.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Constant area flow with heat transfer,\n  description: Rayleigh flow refers to frictionless flow in a constant-area duct with heat transfer (heating or cooling).,\n  subsystem: General,\n  id: 203,\n  physics_domain: FluidDynamics\n}"}}, {"id": "388", "label": "ID_388", "group": "Parameter", "domain": "未分类", "title": "<b>ID_388</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Thermal choking,\n  description: Maximum heat addition in a Rayleigh flow occurs when the Mach number reaches unity; further heating causes thermal choking.,\n  subsystem: General,\n  id: 47,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "545.0", "label": "ID_545.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_545.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Maximum heat addition,\n  description: Maximum heat addition in a Rayleigh flow occurs when the Mach number reaches unity; further heating causes thermal choking.,\n  subsystem: General,\n  id: 204,\n  physics_domain: Thermodynamics\n}"}}, {"id": "674.0", "label": "ID_674.0", "group": "Component", "domain": "未分类", "title": "<b>ID_674.0</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: CrossDomain,\n  importance: 1.0,\n  name: Maximum combustor heat addition,\n  description: The foundational physics of Rayleigh flow and thermal choking (Chapter 2) constraint the maximum fuel injection in burners (Chapters 5, 7, and 8).,\n  subsystem: Combustion,\n  id: 333,\n  physics_domain: Thermodynamics\n}"}}, {"id": "389", "label": "ID_389", "group": "Parameter", "domain": "未分类", "title": "<b>ID_389</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Heating in Rayleigh flow,\n  description: Adding heat to a constant-area flow always results in a decrease in total pressure.,\n  subsystem: General,\n  id: 48,\n  physics_domain: FluidDynamics\n}"}}, {"id": "390", "label": "ID_390", "group": "Component", "domain": "未分类", "title": "<b>ID_390</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 系统分类,\n  importance: 1.0,\n  name: Rocket engine,\n  description: A rocket engine carries both its fuel and its oxidizer, allowing it to operate in a vacuum outside the atmosphere.,\n  subsystem: General,\n  id: 49,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "391", "label": "ID_391", "group": "Equation", "domain": "未分类", "title": "<b>ID_391</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 性能指标,\n  importance: 0.6,\n  name: Rocket thrust equation,\n  description: The total thrust of a rocket is the sum of the momentum thrust and the pressure thrust: F = m_dot * V_e + (P_e - P_a) * A_e.,\n  subsystem: General,\n  id: 50,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "546.0", "label": "ID_546.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_546.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Momentum thrust and Pressure thrust,\n  description: The total thrust of a rocket is the sum of the momentum thrust and the pressure thrust: F = m_dot * V_e + (P_e - P_a) * A_e.,\n  subsystem: General,\n  id: 205,\n  physics_domain: FluidDynamics\n}"}}, {"id": "676.0", "label": "ID_676.0", "group": "Component", "domain": "未分类", "title": "<b>ID_676.0</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: CrossDomain,\n  importance: 1.0,\n  name: Nozzle efficiency and chemical kinetics,\n  description: The ideal rocket thrust relations (Chapter 3) are modified in Chapter 6 by implementing nozzle velocity coefficients and shifting/frozen chemical behaviors.,\n  subsystem: Exhaust,\n  id: 335,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "392", "label": "ID_392", "group": "Parameter", "domain": "未分类", "title": "<b>ID_392</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Momentum thrust,\n  description: The component of thrust generated by the change in momentum of the exhaust gas (m_dot * V_e).,\n  subsystem: General,\n  id: 51,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "547.0", "label": "ID_547.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_547.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Mass flow rate times Exhaust velocity,\n  description: The component of thrust generated by the change in momentum of the exhaust gas (m_dot * V_e).,\n  subsystem: Exhaust,\n  id: 206,\n  physics_domain: FluidDynamics\n}"}}, {"id": "393", "label": "ID_393", "group": "Parameter", "domain": "未分类", "title": "<b>ID_393</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Pressure thrust,\n  description: The component of thrust due to the difference between exit pressure and ambient pressure ((P_e - P_a) * A_e).,\n  subsystem: General,\n  id: 52,\n  physics_domain: FluidDynamics\n}"}}, {"id": "548.0", "label": "ID_548.0", "group": "Component", "domain": "未分类", "title": "<b>ID_548.0</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 性能指标,\n  importance: 1.0,\n  name: Pressure difference times Nozzle exit area,\n  description: The component of thrust due to the difference between exit pressure and ambient pressure ((P_e - P_a) * A_e).,\n  subsystem: Exhaust,\n  id: 207,\n  physics_domain: FluidDynamics\n}"}}, {"id": "394", "label": "ID_394", "group": "Parameter", "domain": "未分类", "title": "<b>ID_394</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Effective exhaust velocity,\n  description: The effective exhaust velocity C is defined such that F = m_dot * C, which combines momentum and pressure effects.,\n  subsystem: Exhaust,\n  id: 53,\n  physics_domain: FluidDynamics\n}"}}, {"id": "549.0", "label": "ID_549.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_549.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust divided by Mass flow rate,\n  description: The effective exhaust velocity C is defined such that F = m_dot * C, which combines momentum and pressure effects.,\n  subsystem: General,\n  id: 208,\n  physics_domain: FluidDynamics\n}"}}, {"id": "395", "label": "ID_395", "group": "Parameter", "domain": "未分类", "title": "<b>ID_395</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Specific impulse,\n  description: Specific impulse I_sp is the thrust divided by the propellant weight flow rate at sea level: I_sp = F / (m_dot * g_0).,\n  subsystem: General,\n  id: 54,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "550.0", "label": "ID_550.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_550.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust per unit weight flow rate,\n  description: Specific impulse I_sp is the thrust divided by the propellant weight flow rate at sea level: I_sp = F / (m_dot * g_0).,\n  subsystem: General,\n  id: 209,\n  physics_domain: FluidDynamics\n}"}}, {"id": "396", "label": "ID_396", "group": "Parameter", "domain": "未分类", "title": "<b>ID_396</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Characteristic velocity,\n  description: The characteristic velocity c* is a measure of the combustion chemical energy and efficiency, independent of nozzle characteristics.,\n  subsystem: General,\n  id: 55,\n  physics_domain: FluidDynamics\n}"}}, {"id": "552.0", "label": "ID_552.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_552.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Chamber pressure and Throat area,\n  description: c* = (P_c * A_t) / m_dot. It depends primarily on combustion temperature and molecular weight.,\n  subsystem: General,\n  id: 211,\n  physics_domain: FluidDynamics\n}"}}, {"id": "551.0", "label": "ID_551.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_551.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Combustion chamber performance,\n  description: The characteristic velocity c* is a measure of the combustion chemical energy and efficiency, independent of nozzle characteristics.,\n  subsystem: Combustion,\n  id: 210,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "397", "label": "ID_397", "group": "Parameter", "domain": "未分类", "title": "<b>ID_397</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust coefficient,\n  description: The thrust coefficient C_f measures the amplification of thrust achieved by expanding the gas through the nozzle.,\n  subsystem: General,\n  id: 56,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "554.0", "label": "ID_554.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_554.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust and Chamber pressure,\n  description: C_f = F / (P_c * A_t). It is a function of the pressure ratio and area ratio of the nozzle.,\n  subsystem: General,\n  id: 213,\n  physics_domain: FluidDynamics\n}"}}, {"id": "553.0", "label": "ID_553.0", "group": "Component", "domain": "未分类", "title": "<b>ID_553.0</b> (Component)", "properties": {"raw" , {"id": "612.0", "label": "ID_612.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_612.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧损失,\n  importance: 0.8,\n  name: Characteristic velocity ratio,\n  description: Combustion efficiency is often expressed as the ratio of actual characteristic velocity (c*_actual) to the theoretical characteristic velocity (c*_theoretical).,\n  subsystem: General,\n  id: 271,\n  physics_domain: FluidDynamics\n}"}}, {"id": "457", "label": "ID_457", "group": "Parameter", "domain": "未分类", "title": "<b>ID_457</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Frozen flow,\n  description: Frozen flow assumes that the chemical composition of the exhaust gas remains constant (fixed at chamber exit state) during expansion through the nozzle.,\n  subsystem: General,\n  id: 116,\n  physics_domain: FluidDynamics\n}"}}, {"id": "613.0", "label": "ID_613.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_613.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Fixed chemical composition,\n  description: Frozen flow assumes that the chemical composition of the exhaust gas remains constant (fixed at chamber exit state) during expansion through the nozzle.,\n  subsystem: General,\n  id: 272,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "458", "label": "ID_458", "group": "Parameter", "domain": "未分类", "title": "<b>ID_458</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Equilibrium flow,\n  description: Equilibrium flow assumes that chemical reactions occur instantaneously as pressure and temperature drop, continually adjusting composition to maintain local equilibrium.,\n  subsystem: General,\n  id: 117,\n  physics_domain: FluidDynamics\n}"}}, {"id": "614.0", "label": "ID_614.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_614.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Instantaneous chemical reaction,\n  description: Equilibrium flow assumes that chemical reactions occur instantaneously as pressure and temperature drop, continually adjusting composition to maintain local equilibrium.,\n  subsystem: General,\n  id: 273,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "615.0", "label": "ID_615.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_615.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Higher specific impulse,\n  description: Equilibrium flow gives higher calculated exhaust velocity and specific impulse than frozen flow because chemical recombination energy is recovered as kinetic energy.,\n  subsystem: General,\n  id: 274,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "459", "label": "ID_459", "group": "Parameter", "domain": "未分类", "title": "<b>ID_459</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能预测,\n  importance: 0.8,\n  name: Real specific impulse,\n  description: The actual expansion process in a real rocket nozzle falls between the ideal frozen and shifting equilibrium bounds.,\n  subsystem: General,\n  id: 118,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "616.0", "label": "ID_616.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_616.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 性能预测,\n  importance: 0.5,\n  name: Frozen flow and Equilibrium flow limits,\n  description: The actual expansion process in a real rocket nozzle falls between the ideal frozen and shifting equilibrium bounds.,\n  subsystem: General,\n  id: 275,\n  physics_domain: FluidDynamics\n}"}}, {"id": "460", "label": "ID_460", "group": "Parameter", "domain": "未分类", "title": "<b>ID_460</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 传热损失,\n  importance: 0.8,\n  name: Thrust chamber heat transfer,\n  description: Heat loss through the chamber walls and nozzle liners directly reduces the thermal energy available for conversion into kinetic energy.,\n  subsystem: General,\n  id: 119,\n  physics_domain: Thermodynamics\n}"}}, {"id": "617.0", "label": "ID_617.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_617.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 传热损失,\n  importance: 0.8,\n  name: Exhaust gas enthalpy,\n  description: Heat loss through the chamber walls and nozzle liners directly reduces the thermal energy available for conversion into kinetic energy.,\n  subsystem: Exhaust,\n  id: 276,\n  physics_domain: Thermodynamics\n}"}}, {"id": "461", "label": "ID_461", "group": "Parameter", "domain": "未分类", "title": "<b>ID_461</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构与传热,\n  importance: 0.8,\n  name: Regenerative cooling,\n  description: Regenerative cooling pumps the fuel or oxidizer through passages surrounding the thrust chamber wall to absorb heat before injection.,\n  subsystem: General,\n  id: 120,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "618.0", "label": "ID_618.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_618.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构与传热,\n  importance: 0.8,\n  name: Fuel through cooling jackets,\n  description: Regenerative cooling pumps the fuel or oxidizer through passages surrounding the thrust chamber wall to absorb heat before injection.,\n  subsystem: General,\n  id: 277,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "619.0", "label": "ID_619.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_619.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 结构与传热,\n  importance: 0.5,\n  name: Wall heat loss,\n  description: The heat absorbed by the coolant is reintroduced into the combustion chamber, preventing a net thermodynamic energy loss.,\n  subsystem: General,\n  id: 278,\n  physics_domain: Thermodynamics\n}"}}, {"id": "462", "label": "ID_462", "group": "Parameter", "domain": "未分类", "title": "<b>ID_462</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构与传热,\n  importance: 0.8,\n  name: Film cooling,\n  description: Injecting a small portion of fuel or inert gas along the internal wall creates a protective film that shields the structure from high-temperature core gases.,\n  subsystem: General,\n  id: 121,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "620.0", "label": "ID_620.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_620.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 结构与传热,\n  importance: 0.5,\n  name: Cooling fluid boundary layer,\n  description: Injecting a small portion of fuel or inert gas along the internal wall creates a protective film that shields the structure from high-temperature core gases.,\n  subsystem: General,\n  id: 279,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "463", "label": "ID_463", "group": "Equation", "domain": "未分类", "title": "<b>ID_463</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 动力循环,\n  importance: 0.6,\n  name: Liquid rocket cycle,\n  description: Liquid rocket engine cycles are classified into pressure-fed systems or pump-fed systems based on how propellants are pressurized.,\n  subsystem: Cycle,\n  id: 122,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "464", "label": "ID_464", "group": "Equation", "domain": "未分类", "title": "<b>ID_464</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 动力循环,\n  importance: 0.6,\n  name: Pump-fed cycle,\n  description: A pump-fed open cycle where a fraction of the propellant is burned in a separate combustor to drive the turbine and is then exhausted overboard.,\n  subsystem: Cycle,\n  id: 123,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "465", "label": "ID_465", "group": "Equation", "domain": "未分类", "title": "<b>ID_465</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 动力循环,\n  importance: 0.6,\n  name: Gas-generator cycle,\n  description: The gas generator must operate off-stoichiometric (extremely fuel-rich or oxidizer-rich) to prevent melting the turbine blades.,\n  subsystem: Cycle,\n  id: 124,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "623.0", "label": "ID_623.0", "group": "Component", "domain": "未分类", "title": "<b>ID_623.0</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 动力循环,\n  importance: 1.0,\n  name: Turbine inlet temperature,\n  description: The gas generator must operate off-stoichiometric (extremely fuel-rich or oxidizer-rich) to prevent melting the turbine blades.,\n  subsystem: Expansion,\n  id: 282,\n  physics_domain: Thermodynamics\n}"}}, {"id": "466", "label": "ID_466", "group": "Equation", "domain": "未分类", "title": "<b>ID_466</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 动力循环,\n  importance: 0.6,\n  name: Staged combustion cycle,\n  description: Because the turbine exhaust is injected into the main chamber rather than dumped at low pressure, it allows extremely high chamber pressures (P_c) and higher efficiency.,\n  subsystem: Combustion,\n  id: 125,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "467", "label": "ID_467", "group": "Equation", "domain": "未分类", "title": "<b>ID_467</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 系统匹配,\n  importance: 0.6,\n  name: Turbopump power balance,\n  description: In steady-state pump-fed cycles, the power produced by the turbine must equal the total mechanical power required to drive the oxidizer and fuel pumps.,\n  subsystem: General,\n  id: 126,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "625.0", "label": "ID_625.0", "group": "Component", "domain": "未分类", "title": "<b>ID_625.0</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 系统匹配,\n  importance: 1.0,\n  name: Turbine power equals Pump power,\n  description: In steady-state pump-fed cycles, the power produced by the turbine must equal the total mechanical power required to drive the oxidizer and fuel pumps.,\n  subsystem: Expansion,\n  id: 284,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "468", "label": "ID_468", "group": "Component", "domain": "未分类", "title": "<b>ID_468</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 系统匹配,\n  importance: 1.0,\n  name: Pump power requirement,\n  description: The required shaft power for a propellant pump is proportional to the mass flow rate and pressure rise, divided by the pump efficiency (eta_p).,\n  subsystem: General,\n  id: 127,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "469", "label": "ID_469", "group": "Equation", "domain": "未分类", "title": "<b>ID_469</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 真实循环分析,\n  importance: 0.6,\n  name: Real cycle analysis,\n  description: Real engine cycle analysis incorporates component efficiencies, pressure losses, mechanical losses, and bleeding to predict realistic performance.,\n  subsystem: Cycle,\n  id: 128,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "627.0", "label": "ID_627.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_627.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 真实循环分析,\n  importance: 0.5,\n  name: Component efficiencies and fluid losses,\n  description: Real engine cycle analysis incorporates component efficiencies, pressure losses, mechanical losses, and bleeding to predict realistic performance.,\n  subsystem: General,\n  id: 286,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "470", "label": "ID_470", "group": "Parameter", "domain": "未分类", "title": "<b>ID_470</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡喷循环,\n  importance: 0.8,\n  name: Real turbojet,\n  description: The net thrust of a real turbojet must account for exit velocity variations caused by nozzle efficiency (eta_n) and incomplete expansion.,\n  subsystem: General,\n  id: 129,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "471", "label": "ID_471", "group": "Parameter", "domain": "未分类", "title": "<b>ID_471</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡喷循环,\n  importance: 0.8,\n  name: Real turbojet efficiency,\n  description: Irreversibilities in the compressor and turbine increase entropy, directly decreasing the specific thrust and increasing the TSFC.,\n  subsystem: General,\n  id: 130,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "630.0", "label": "ID_630.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_630.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 涡喷循环,\n  importance: 0.5,\n  name: Component irreversibilities,\n  description: Irreversibilities in the compressor and turbine increase entropy, directly decreasing the specific thrust and increasing the TSFC.,\n  subsystem: General,\n  id: 289,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "472", "label": "ID_472", "group": "Component", "domain": "未分类", "title": "<b>ID_472</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 性能匹配,\n  importance: 1.0,\n  name: Turbine temperature ratio tau_t,\n  description: In a real turbojet, the turbine temperature drop is determined by the actual power required to drive the compressor: tau_t = 1 - (tau_lambda / tau_r) * (tau_c - 1) / (eta_m * (1 + f)).,\n  subsystem: Expansion,\n  id: 131,\n  physics_domain: Thermodynamics\n}"}}, {"id": "631.0", "label": "ID_631.0", "group": "Equation", "domain": "未分类", "title": "<b>ID_631.0</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 性能匹配,\n  importance: 0.6,\n  name: Compressor power balance,\n  description: In a real turbojet, the turbine temperature drop is determined by the actual power required to drive the compressor: tau_t = 1 - (tau_lambda / tau_r) * (tau_c - 1) / (eta_m * (1 + f)).,\n  subsystem: Compression,\n  id: 290,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "473", "label": "ID_473", "group": "Parameter", "domain": "未分类", "title": "<b>ID_473</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能匹配,\n  importance: 0.8,\n  name: Fuel-air ratio f,\n  description: The actual fuel-air ratio f accounts for combustor efficiency eta_b and variable specific heats across the burner.,\n  subsystem: General,\n  id: 132,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "632.0", "label": "ID_632.0", "group": "Equation", "domain": "未分类", "title": "<b>ID_632.0</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 性能匹配,\n  importance: 0.6,\n  name: Combustor energy balance,\n  description: The actual fuel-air ratio f accounts for combustor efficiency eta_b and variable specific heats across the burner.,\n  subsystem: Combustion,\n  id: 291,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "474", "label": "ID_474", "group": "Component", "domain": "未分类", "title": "<b>ID_474</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 加力循环,\n  importance: 1.0,\n  name: Real afterburner,\n  description: The afterburner burns remaining oxygen in the turbine exhaust gas, but its efficiency (eta_AB) is lower than the main combustor.,\n  subsystem: Combustion,\n  id: 133,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "633.0", "label": "ID_633.0", "group": "Parameter", "domain": "未分类", "title": "<b>ID_633.0</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_doma : Atmospheric oxygen,\n  description: An airbreathing engine utilizes the oxygen in the atmospheric air to burn the fuel carried within the vehicle.,\n  subsystem: General,\n  id: 158,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "500", "label": "ID_500", "group": "Parameter", "domain": "未分类", "title": "<b>ID_500</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 工作原理,\n  importance: 0.8,\n  name: Fuel and Oxidizer,\n  description: A non-airbreathing engine carries both the fuel and the oxidizer required for combustion.,\n  subsystem: General,\n  id: 159,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "501", "label": "ID_501", "group": "Component", "domain": "未分类", "title": "<b>ID_501</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 部件关系,\n  importance: 1.0,\n  name: Gas turbine engine,\n  description: The core of any gas turbine engine is the gas generator.,\n  subsystem: Expansion,\n  id: 160,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "502", "label": "ID_502", "group": "Parameter", "domain": "未分类", "title": "<b>ID_502</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构组成,\n  importance: 0.8,\n  name: Fan,\n  description: A turbofan engine adds a fan driven by an additional turbine stage or a separate spool.,\n  subsystem: General,\n  id: 161,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "503", "label": "ID_503", "group": "Parameter", "domain": "未分类", "title": "<b>ID_503</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构组成,\n  importance: 0.8,\n  name: Propeller,\n  description: A turboprop engine uses a gas turbine core to drive a propeller through a reduction gearbox.,\n  subsystem: General,\n  id: 162,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "504", "label": "ID_504", "group": "Parameter", "domain": "未分类", "title": "<b>ID_504</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_ engine's kinetic energy output is converted into aircraft propulsive power.,\n  subsystem: General,\n  id: 172,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "514", "label": "ID_514", "group": "Parameter", "domain": "未分类", "title": "<b>ID_514</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thermal efficiency and Propulsive efficiency,\n  description: The overall efficiency of a propulsion system is the product of its thermal and propulsive efficiencies.,\n  subsystem: General,\n  id: 173,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "515", "label": "ID_515", "group": "Parameter", "domain": "未分类", "title": "<b>ID_515</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust per unit air mass flow,\n  description: Specific thrust is the thrust produced per unit mass flow rate of air entering the engine.,\n  subsystem: General,\n  id: 174,\n  physics_domain: FluidDynamics\n}"}}, {"id": "516", "label": "ID_516", "group": "Parameter", "domain": "未分类", "title": "<b>ID_516</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Fan mass flow to core mass flow,\n  description: The bypass ratio (alpha) is the ratio of the mass flow rate bypassing the core to the mass flow rate passing through the core.,\n  subsystem: General,\n  id: 175,\n  physics_domain: FluidDynamics\n}"}}, {"id": "517", "label": "ID_517", "group": "Parameter", "domain": "未分类", "title": "<b>ID_517</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能特性,\n  importance: 0.8,\n  name: Lower TSFC,\n  description: High bypass ratio engines generally provide lower TSFC at subsonic cruise speeds.,\n  subsystem: General,\n  id: 176,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "518", "label": "ID_518", "group": "Parameter", "domain": "未分类", "title": "<b>ID_518</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 控制方程,\n  importance: 0.8,\n  name: Conservation of mass,\n  description: The continuity equation expresses the principle of conservation of mass for a control volume.,\n  subsystem: General,\n  id: 177,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "519", "label": "ID_519", "group": "Equation", "domain": "未分类", "title": "<b>ID_519</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 控制方程,\n  importance: 0.6,\n  name: Newton's second law,\n  description: The momentum equation expresses Newton's second law of motion for a fluid passing through a control volume.,\n  subsystem: General,\n  id: 178,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "520", "label": "ID_520", "group": "Equation", "domain": "未分类", "title": "<b>ID_520</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 控制方程,\n  importance: 0.6,\n  name: First law of thermodynamics,\n  description: The energy equation is a statement of the first law of thermodynamics applied to a fluid flowing through a control volume.,\n  subsystem: General,\n  id: 179,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "521", "label": "ID_521", "group": "Parameter", "domain": "未分类", "title": "<b>ID_521</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 流体特性,\n  importance: 0.8,\n  name: Time-independent properties,\n  description: A flow is defined as steady if its properties at any point within the control volume do not vary with time.,\n  subsystem: General,\n  id: 180,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "522", "label": "ID_522", "group": "Parameter", "domain": "未分类", "title": "<b>ID_522</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 流体特性,\n  importance: 0.8,\n  name: Uniform properties across cross section,\n  description: A flow is one-dimensional if the fluid properties are uniform across any cross section perpendicular to the flow direction.,\n  subsystem: General,\n  id: 181,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "523", "label": "ID_523", "group": "Equation", "domain": "未分类", "title": "<b>ID_523</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 热力学基础,\n  importance: 0.6,\n  name: Thermal equation of state,\n  description: A perfect gas is a gas whose intermolecular forces are negligible and obeys the thermal equation of state P = rho*R*T.,\n  subsystem: General,\n  id: 182,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "524", "label": "ID_524", "group": "Parameter", "domain": "未分类", "title": "<b>ID_524</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 热力学基础,\n  importance: 0.8,\n  name: Constant specific heats,\n  description: A calorically perfect gas is a perfect gas with constant specific heats (c_p and c_v are constants).,\n  subsystem: General,\n  id: 183,\n  physics_domain: Thermodynamics\n}"}}, {"id": "525", "label": "ID_525", "group": "Parameter", "domain": "未分类", "title": "<b>ID_525</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 气体动力学,\n  importance: 0.8,\n  name: Square root of gamma*R*T,\n  description: The speed of sound 'a' in a calorically perfect gas is given by a = sqrt(gamma * R * T).,\n  subsystem: General,\n  id: 184,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "526", "label": "ID_526", "group": "Parameter", "domain": "未分类", "title": "<b>ID_526</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 气体动力学,\n  importance: 0.8,\n  name: Ratio of velocity to speed of sound,\n  description: The Mach number M is defined as the ratio of the local fluid velocity V to the local speed of sound 'a'.,\n  subsystem: General,\n  id: 185,\n  physics_domain: FluidDynamics\n}"}}, {"id": "527", "label": "ID_527", "group": "Parameter", "domain": "未分类", "title": "<b>ID_527</b> (Parameter)", "properties": {"raw":
