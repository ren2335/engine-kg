escription: When the Mach number at the throat reaches unity, the mass flow rate through the nozzle reaches its maximum possible value and is said to be choked.,\n  subsystem: General,\n  id: 195,\n  physics_domain: FluidDynamics\n}"}}, {"id": "537", "label": "ID_537", "group": "Parameter", "domain": "未分类", "title": "<b>ID_537</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 激波理论,\n  importance: 0.8,\n  name: Discontinuity in supersonic flow,\n  description: A normal shock wave is a thin discontinuity perpendicular to the flow direction that can occur only in supersonic flow.,\n  subsystem: General,\n  id: 196,\n  physics_domain: FluidDynamics\n}"}}, {"id": "538", "label": "ID_538", "group": "Parameter", "domain": "未分类", "title": "<b>ID_538</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 激波理论,\n  importance: 0.8,\n  name: Supersonic to Subsonic,\n  description: The Mach number always drops from a supersonic value upstream to a subsonic value downstream of a normal shock.,\n  subsystem: General,\n  id: 197,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "539", "label": "ID_539", "group": "Parameter", "domain": "未分类", "title": "<b>ID_539</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 激波理论,\n  importance: 0.8,\n  name: Static pressure,\n  description: Static pressure increases significantly across a normal shock wave.,\n  subsystem: General,\n  id: 198,\n  physics_domain: FluidDynamics\n}"}}, {"id": "540", "label": "ID_540", "group": "Parameter", "domain": "未分类", "title": "<b>ID_540</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 激波理论,\n  importance: 0.8,\n  name: Static temperature,\n  description: Static temperature increases across a normal shock wave.,\n  subsystem: General,\n  id: 199,\n  physics_domain: Thermodynamics\n}"}}, {"id": "541", "label": "ID_541", "group": "Parameter", "domain": "未分类", "title": "<b>ID_541</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 激波理论,\n  importance: 0.8,\n  name: Total pressure,\n  description: The total pressure decreases across a normal shock, which represents an irreversibility (entropy rise) in the flow.,\n  subsystem: General,\n  id: 200,\n  physics_domain: FluidDynamics\n}"}}, {"id": "542", "label": "ID_542", "group": "Parameter", "domain": "未分类", "title": "<b>ID_542</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Constant area flow with friction,\n  description: Fanno flow refers to adiabatic flow in a constant-area duct with friction.,\n  subsystem: General,\n  id: 201,\n  physics_domain: FluidDynamics\n}"}}, {"id": "543", "label": "ID_543", "group": "Parameter", "domain": "未分类", "title": "<b>ID_543</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Unity,\n  description: Friction always drives the Mach number toward unity in Fanno flow, whether the inlet flow is subsonic or supersonic.,\n  subsystem: General,\n  id: 202,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "544", "label": "ID_544", "group": "Parameter", "domain": "未分类", "title": "<b>ID_544</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Constant area flow with heat transfer,\n  description: Rayleigh flow refers to frictionless flow in a constant-area duct with heat transfer (heating or cooling).,\n  subsystem: General,\n  id: 203,\n  physics_domain: FluidDynamics\n}"}}, {"id": "545", "label": "ID_545", "group": "Parameter", "domain": "未分类", "title": "<b>ID_545</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 管流理论,\n  importance: 0.8,\n  name: Maximum heat addition,\n  description: Maximum heat addition in a Rayleigh flow occurs when the Mach number reaches unity; further heating causes thermal choking.,\n  subsystem: General,\n  id: 204,\n  physics_domain: Thermodynamics\n}"}}, {"id": "546", "label": "ID_546", "group": "Parameter", "domain": "未分类", "title": "<b>ID_546</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Momentum thrust and Pressure thrust,\n  description: The total thrust of a rocket is the sum of the momentum thrust and the pressure thrust: F = m_dot * V_e + (P_e - P_a) * A_e.,\n  subsystem: General,\n  id: 205,\n  physics_domain: FluidDynamics\n}"}}, {"id": "547", "label": "ID_547", "group": "Parameter", "domain": "未分类", "title": "<b>ID_547</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Mass flow rate times Exhaust velocity,\n  description: The component of thrust generated by the change in momentum of the exhaust gas (m_dot * V_e).,\n  subsystem: Exhaust,\n  id: 206,\n  physics_domain: FluidDynamics\n}"}}, {"id": "548", "label": "ID_548", "group": "Component", "domain": "未分类", "title": "<b>ID_548</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 性能指标,\n  importance: 1.0,\n  name: Pressure difference times Nozzle exit area,\n  description: The component of thrust due to the difference between exit pressure and ambient pressure ((P_e - P_a) * A_e).,\n  subsystem: Exhaust,\n  id: 207,\n  physics_domain: FluidDynamics\n}"}}, {"id": "549", "label": "ID_549", "group": "Parameter", "domain": "未分类", "title": "<b>ID_549</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust divided by Mass flow rate,\n  description: The effective exhaust velocity C is defined such that F = m_dot * C, which combines momentum and pressure effects.,\n  subsystem: General,\n  id: 208,\n  physics_domain: FluidDynamics\n}"}}, {"id": "550", "label": "ID_550", "group": "Parameter", "domain": "未分类", "title": "<b>ID_550</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust per unit weight flow rate,\n  description: Specific impulse I_sp is the thrust divided by the propellant weight flow rate at sea level: I_sp = F / (m_dot * g_0).,\n  subsystem: General,\n  id: 209,\n  physics_domain: FluidDynamics\n}"}}, {"id": "551", "label": "ID_551", "group": "Parameter", "domain": "未分类", "title": "<b>ID_551</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Combustion chamber performance,\n  description: The characteristic velocity c* is a measure of the combustion chemical energy and efficiency, independent of nozzle characteristics.,\n  subsystem: Combustion,\n  id: 210,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "552", "label": "ID_552", "group": "Parameter", "domain": "未分类", "title": "<b>ID_552</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Chamber pressure and Throat area,\n  description: c* = (P_c * A_t) / m_dot. It depends primarily on combustion temperature and molecular weight.,\n  subsystem: General,\n  id: 211,\n  physics_domain: FluidDynamics\n}"}}, {"id": "553", "label": "ID_553", "group": "Component", "domain": "未分类", "title": "<b>ID_553</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 性能指标,\n  importance: 1.0,\n  name: Nozzle expansion efficiency,\n  description: The thrust coefficient C_f measures the amplification of thrust achieved by expanding the gas through the nozzle.,\n  subsystem: Expansion,\n  id: 212,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "554", "label": "ID_554", "group": "Parameter", "domain": "未分类", "title": "<b>ID_554</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Thrust and Chamber pressure,\n  description: C_f = F / (P_c * A_t). It is a function of the pressure ratio and area ratio of the nozzle.,\n  subsystem: General,\n  id: 213,\n  physics_domain: FluidDynamics\n}"}}, {"id": "555", "label": "ID_555", "group": "Parameter", "domain": "未分类", "title": "<b>ID_555</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管空气动力学,\n  importance: 0.8,\n  name: Exit pressure equals Ambient pressure,\n  description: Maximum thrust for a given propellant mass flow and chamber condition occurs when the nozzle exit pressure equals the ambient pressure (P_e = P_a).,\n  subsystem: General,\n  id: 214,\n  physics_domain: FluidDynamics\n}"}}, {"id": "556", "label": "ID_556", "group": "Parameter", "domain": "未分类", "title": "<b>ID_556</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管空气动力学,\n  importance: 0.8,\n  name: Exit pressure less than Ambient pressure,\n  description: A nozzle is overexpanded if the exit pressure is lower than the surrounding ambient atmospheric pressure.,\n  subsystem: General,\n  id: 215,\n  physics_domain: FluidDynamics\n}"}}, {"id": "557", "label": "ID_557", "group": "Parameter", "domain": "未分类", "title": "<b>ID_557</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管空气动力学,\n  importance: 0.8,\n  name: Exit pressure greater than Ambient pressure,\n  description: A nozzle is underexpanded if the gas exits at a pressure higher than the ambient atmospheric pressure.,\n  subsystem: General,\n  id: 216,\n  physics_domain: FluidDynamics\n}"}}, {"id": "558", "label": "ID_558", "group": "Parameter", "domain": "未分类", "title": "<b>ID_558</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统架构,\n  importance: 0.8,\n  name: Liquid fuel and Liquid oxidizer,\n  description: Liquid rocket systems utilize liquid chemical propellants stored in separate tanks.,\n  subsystem: General,\n  id: 217,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "559", "label": "ID_559", "group": "Parameter", "domain": "未分类", "title": "<b>ID_559</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统架构,\n  importance: 0.8,\n  name: Propellants to combustion chamber,\n  description: High-thrust liquid rockets use turbopumps driven by a gas generator to force propellants into the high-pressure chamber.,\n  subsystem: Combustion,\n  id: 218,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "560", "label": "ID_560", "group": "Parameter", "domain": "未分类", "title": "<b>ID_560</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统架构,\n  importance: 0.8,\n  name: High pressure gas tank,\n  description: A simpler feed system that uses regulated high-pressure gas to push propellants into the combustion chamber.,\n  subsystem: General,\n  id: 219,\n  physics_domain: FluidDynamics\n}"}}, {"id": "561", "label": "ID_561", "group": "Parameter", "domain": "未分类", "title": "<b>ID_561</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统架构,\n  importance: 0.8,\n  name: Exposed cavity surface,\n  description: Combustion takes place on the internal surfaces of the hollow cavity inside the solid grain.,\n  subsystem: General,\n  id: 220,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "562", "label": "ID_562", "group": "Parameter", "domain": "未分类", "title": "<b>ID_562</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧特性,\n  importance: 0.8,\n  name: Thrust increasing with time,\n  description: A grain geometry that causes the burning surface area (and therefore thrust) to increase over time.,\n  subsystem: General,\n  id: 221,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "563", "label": "ID_563", "group": "Parameter", "domain": "未分类", "title": "<b>ID_563</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧特性,\n  importance: 0.8,\n  name: Thrust decreasing with time,\n  description: A grain geometry that causes the burning surface area (and therefore thrust) to decrease over time.,\n  subsystem: General,\n  id: 222,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "564", "label": "ID_564", "group": "Parameter", "domain": "未分类", "title": "<b>ID_564</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧特性,\n  importance: 0.8,\n  name: Constant thrust with time,\n  description: A grain geometry where the burning surface area remains relatively constant during the burn.,\n  subsystem: General,\n  id: 223,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "565", "label": "ID_565", "group": "Parameter", "domain": "未分类", "title": "<b>ID_565</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 飞行学基础,\n  importance: 0.8,\n  name: Velocity gain to Mass ratio,\n  description: The ideal rocket equation (Tsiolkovsky equation) is Delta_V = C * ln(m_i / m_f), neglecting gravity and drag.,\n  subsystem: General,\n  id: 224,\n  physics_domain: FluidDynamics\n}"}}, {"id": "566", "label": "ID_566", "group": "Parameter", "domain": "未分类", "title": "<b>ID_566</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构质量,\n  importance: 0.8,\n  name: Payload and Structural mass and Propellant mass,\n  description: m_i = m_PL + m_s + m_p.,\n  subsystem: General,\n  id: 225,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "567", "label": "ID_567", "group": "Parameter", "domain": "未分类", "title": "<b>ID_567</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构质量,\n  importance: 0.8,\n  name: Structural mass to Total stage mass,\n  description: The structural coefficient (epsilon) is the ratio of the structural mass to the sum of the structural and propellant masses.,\n  subsystem: General,\n  id: 226,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "568", "label": "ID_568", "group": "Parameter", "domain": "未分类", "title": "<b>ID_568</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统优化,\n  importance: 0.8,\n  name: Empty structural mass,\n  description: Multistage rockets discard the dead weight of empty tanks and structures of depleted stages to achieve higher final velocities.,\n  subsystem: General,\n  id: 227,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "569", "label": "ID_569", "group": "Parameter", "domain": "未分类", "title": "<b>ID_569</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统优化,\n  importance: 0.8,\n  name: Payload mass to Initial mass,\n  description: The ratio of the carried payload mass to the initial total mass of that specific rocket stage.,\n  subsystem: General,\n  id: 228,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "570", "label": "ID_570", "group": "Parameter", "domain": "未分类", "title": "<b>ID_570</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 参数循环分析,\n  importance: 0.8,\n  name: Determine performance trends,\n  description: The objective of parametric cycle analysis is to relate the engine performance parameters to the design choices and the flight environment.,\n  subsystem: General,\n  id: 229,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "571", "label": "ID_571", "group": "Parameter", "domain": "未分类", "title": "<b>ID_571</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 工程标准,\n  importance: 0.8,\n  name: SAE Aerospace Standard,\n  description: The gas turbine industry utilizes standard station numbering (e.g., 0 for ambient, 2 for compressor inlet, 3 for compressor exit, 4 for turbine inlet, 5 for turbine exit, 9 for nozzle exit).,\n  subsystem: General,\n  id: 230,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "572", "label": "ID_572", "group": "Parameter", "domain": "未分类", "title": "<b>ID_572</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 循环假设,\n  importance: 0.8,\n  name: Isentropic compression and expansion,\n  description: Ideal cycle analysis assumes that the compression and expansion processes are reversible and adiabatic (isentropic).,\n  subsystem: Compression,\n  id: 231,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "573", "label": "ID_573", "group": "Parameter", "domain": "未分类", "title": "<b>ID_573</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 循环假设,\n  importance: 0.8,\n  name: Constant pressure combustion,\n  description: It is assumed that combustion occurs at constant total pressure (no pressure drop in the combustor).,\n  subsystem: Combustion,\n  id: 232,\n  physics_domain: FluidDynamics\n}"}}, {"id": "574", "label": "ID_574", "group": "Parameter", "domain": "未分类", "title": "<b>ID_574</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 循环假设,\n  importance: 0.8,\n  name: Fuel mass flow rate,\n  description: The mass flow rate of fuel is neglected relative to the air mass flow rate in ideal performance matching (m_dot_f << m_dot_a).,\n  subsystem: General,\n  id: 233,\n  physics_domain: FluidDynamics\n}"}}, {"id": "575", "label": "ID_575", "group": "Component", "domain": "未分类", "title": "<b>ID_575</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 热力学参数,\n  importance: 1.0,\n  name: Exit total temperature over Inlet total temperature,\n  description: The dimensionless parameter tau represents the ratio of stagnation temperatures across a component.,\n  subsystem: General,\n  id: 234,\n  physics_domain: Thermodynamics\n}"}}, {"id": "576", "label": "ID_576", "group": "Component", "domain": "未分类", "title": "<b>ID_576</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 热力学参数,\n  importance: 1.0,\n  name: Exit total pressure over Inlet total pressure,\n  description: The dimensionless parameter pi represents the ratio of stagnation pressures across a component.,\n  subsystem: General,\n  id: 235,\n  physics_domain: FluidDynamics\n}"}}, {"id": "577", "label": "ID_577", "group": "Parameter", "domain": "未分类", "title": "<b>ID_577</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 热力学关系,\n  importance: 0.8,\n  name: Pi equals tau to power of gamma over gamma-1,\n  description: For ideal isentropic components (compressor or turbine), the total pressure ratio and total temperature ratio are directly coupled.,\n  subsystem: General,\n  id: 236,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "578", "label": "ID_578", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_578</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 发动机特性,\n  importance: 0.5,\n  name: High Mach limit,\n  description: For a given maximum turbine inlet temperature, the specific thrust of an ideal turbojet drops to zero at a specific upper flight Mach number limit.,\n  subsystem: General,\n  id: 237,\n  physics_domain: FluidDynamics\n}"}}, {"id": "579", "label": "ID_579", "group": "Component", "domain": "未分类", "title": "<b>ID_579</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 性能优化,\n  importance: 1.0,\n  name: Optimum compressor pressure ratio,\n  description: For a fixed flight condition and turbine inlet temperature, there is an optimum compressor pressure ratio that maximizes the specific thrust of a turbojet.,\n  subsystem: Compression,\n  id: 238,\n  physics_domain: FluidDynamics\n}"}}, {"id": "580", "label": "ID_580", "group": "Component", "domain": "未分类", "title": "<b>ID_580</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 发动机变体,\n  importance: 1.0,\n  name: Stagnation temperature at nozzle,\n  description: An afterburner increases the total temperature of the gas entering the exhaust nozzle without affecting the turbomachinery core.,\n  subsystem: Exhaust,\n  id: 239,\n  physics_domain: Thermodynamics\n}"}}, {"id": "581", "label": "ID_581", "group": "Parameter", "domain": "未分类", "title": "<b>ID_581</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 发动机变体,\n  importance: 0.8,\n  name: Core flow and Bypass flow,\n  description: A turbofan engine divides the incoming air into a primary core stream and a secondary bypass stream.,\n  subsystem: General,\n  id: 240,\n  physics_domain: FluidDynamics\n}"}}, {"id": "582", "label": "ID_582", "group": "Parameter", "domain": "未分类", "title": "<b>ID_582</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Bypass mass flow divided by Core mass flow,\n  description: alpha = m_dot_bypass / m_dot_core.,\n  subsystem: General,\n  id: 241,\n  physics_domain: FluidDynamics\n}"}}, {"id": "583", "label": "ID_583", "group": "Parameter", "domain": "未分类", "title": "<b>ID_583</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 发动机特性,\n  importance: 0.8,\n  name: Turbomachinery,\n  description: A ramjet engine has no compressor or turbine; compression is achieved entirely through the dynamic pressure rise in the inlet.,\n  subsystem: General,\n  id: 242,\n  physics_domain: FluidDynamics\n}"}}, {"id": "584", "label": "ID_584", "group": "Parameter", "domain": "未分类", "title": "<b>ID_584</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 发动机特性,\n  importance: 0.8,\n  name: Zero static thrust,\n  description: An ideal ramjet cannot produce any thrust at zero flight velocity (Mach = 0) because it lacks a mechanical compressor.,\n  subsystem: General,\n  id: 243,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "585", "label": "ID_585", "group": "Parameter", "domain": "未分类", "title": "<b>ID_585</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能优化,\n  importance: 0.8,\n  name: Bypass and Core exit velocities to be equal,\n  description: For an unmixed ideal turbofan, the optimum kinetic energy distribution occurs when the exit velocity of the bypass nozzle equals the exit velocity of the core nozzle.,\n  subsystem: General,\n  id: 244,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "586", "label": "ID_586", "group": "Parameter", "domain": "未分类", "title": "<b>ID_586</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 真实部件特性,\n  importance: 0.8,\n  name: Component efficiencies and Total pressure ratios,\n  description: The performance of real components is characterized by total temperature ratios, total pressure ratios, efficiencies, and pressure losses.,\n  subsystem: General,\n  id: 245,\n  physics_domain: FluidDynamics\n}"}}, {"id": "587", "label": "ID_587", "group": "Parameter", "domain": "未分类", "title": "<b>ID_587</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 进气道特性,\n  importance: 0.8,\n  name: Total pressure ratio pi_d,\n  description: The performance of the inlet (or diffuser) is primarily characterized by its total pressure ratio, pi_d = P_t2 / P_t0, also called the inlet recovery factor.,\n  subsystem: General,\n  id: 246,\n  physics_domain: FluidDynamics\n}"}}, {"id": "588", "label": "ID_588", "group": "Parameter", "domain": "未分类", "title": "<b>ID_588</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 进气道特性,\n  importance: 0.8,\n  name: Flight Mach number,\n  description: Military specifications (like MIL-E-5007D) define standard inlet recovery curves that decrease as the flight Mach number increases above 1.0.,\n  subsystem: General,\n  id: 247,\n  physics_domain: FluidDynamics\n}"}}, {"id": "589", "label": "ID_589", "group": "Parameter", "domain": "未分类", "title": "<b>ID_589</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 进气道特性,\n  importance: 0.8,\n  name: Capture area air mass flow to Maximum air mass flow,\n  description: The ratio of the actual mass flow entered into the inlet to the maximum possible mass flow that the capture area can intercept.,\n  subsystem: General,\n  id: 248,\n  physics_domain: FluidDynamics\n}"}}, {"id": "590", "label": "ID_590", "group": "Parameter", "domain": "未分类", "title": "<b>ID_590</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 压气机特性,\n  importance: 0.8,\n  name: Isentropic efficiency eta_c,\n  description: The isentropic compressor efficiency eta_c is defined as the ratio of ideal (isentropic) work to the actual work required for a given total pressure ratio.,\n  subsystem: General,\n  id: 249,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "591", "label": "ID_591", "group": "Parameter", "domain": "未分类", "title": "<b>ID_591</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 压气机特性,\n  importance: 0.8,\n  name: Isentropic efficiency and Total pressure ratio,\n  description: tau_c = 1 + (pi_c^((gamma-1)/gamma) - 1) / eta_c, which links actual temperature rise to pressure ratio.,\n  subsystem: General,\n  id: 250,\n  physics_domain: FluidDynamics\n}"}}, {"id": "592", "label": "ID_592", "group": "Parameter", "domain": "未分类", "title": "<b>ID_592</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 效率理论,\n  importance: 0.8,\n  name: Isentropic efficiency of an infinitesimal stage,\n  description: Polytropic efficiency (e_c for compressor, e_t for turbine) is defined as the isentropic efficiency of an elemental or infinitesimal stage.,\n  subsystem: General,\n  id: 251,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "593", "label": "ID_593", "group": "Parameter", "domain": "未分类", "title": "<b>ID_593</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 效率理论,\n  importance: 0.8,\n  name: Increasing pressure ratio,\n  description: For a constant polytropic efficiency e_c, the overall isentropic compressor efficiency eta_c drops as the total pressure ratio pi_c increases due to the preheating effect.,\n  subsystem: General,\n  id: 252,\n  physics_domain: FluidDynamics\n}"}}, {"id": "594", "label": "ID_594", "group": "Parameter", "domain": "未分类", "title": "<b>ID_594</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡轮特性,\n  importance: 0.8,\n  name: Isentropic efficiency eta_t,\n  description: The isentropic turbine efficiency eta_t is defined as the ratio of actual work output to the ideal (isentropic) work output for a given total pressure ratio.,\n  subsystem: General,\n  id: 253,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "595", "label": "ID_595", "group": "Parameter", "domain": "未分类", "title": "<b>ID_595</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧室特性,\n  importance: 0.8,\n  name: Combustion efficiency eta_b,\n  description: Combustion efficiency eta_b is the ratio of the actual thermal energy released to the chemical energy available in the fuel.,\n  subsystem: Combustion,\n  id: 254,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "596", "label": "ID_596", "group": "Parameter", "domain": "未分类", "title": "<b>ID_596</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧室特性,\n  importance: 0.8,\n  name: Total pressure ratio pi_b,\n  description: The total pressure ratio of the combustor pi_b = P_t4 / P_t3 is always less than 1.0 due to viscous friction and cold-to-hot flow momentum pressure drop.,\n  subsystem: General,\n  id: 255,\n  physics_domain: FluidDynamics\n}"}}, {"id": "597", "label": "ID_597", "group": "Parameter", "domain": "未分类", "title": "<b>ID_597</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧室特性,\n  importance: 0.8,\n  name: Friction and Fundamental thermal loading,\n  description: Total pressure drops because of skin friction in the liner liners/swirlers and the fundamental thermodynamic loss from adding heat at finite Mach numbers.,\n  subsystem: General,\n  id: 256,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "598", "label": "ID_598", "group": "Component", "domain": "未分类", "title": "<b>ID_598</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 加力燃烧室,\n  importance: 1.0,\n  name: Afterburner efficiency eta_AB,\n  description: The efficiency eta_AB measures how completely the fuel burns in the afterburner duct upstream of the exit nozzle.,\n  subsystem: Combustion,\n  id: 257,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "599", "label": "ID_599", "group": "Parameter", "domain": "未分类", "title": "<b>ID_599</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 加力燃烧室,\n  importance: 0.8,\n  name: Total pressure ratio pi_AB,\n  description: The total pressure ratio pi_AB = P_t7 / P_t6 account for losses due to flameholders, friction, and high-temperature heat addition.,\n  subsystem: General,\n  id: 258,\n  physics_domain: FluidDynamics\n}"}}, {"id": "600", "label": "ID_600", "group": "Parameter", "domain": "未分类", "title": "<b>ID_600</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 机械传动,\n  importance: 0.8,\n  name: Mechanical efficiency eta_m,\n  description: Mechanical efficiency eta_m accounts for frictional power losses in bearings and accessory gearboxes connecting the turbine and compressor shafts.,\n  subsystem: General,\n  id: 259,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "601", "label": "ID_601", "group": "Parameter", "domain": "未分类", "title": "<b>ID_601</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管特性,\n  importance: 0.8,\n  name: Total pressure ratio pi_n,\n  description: The exhaust nozzle performance is characterized by its total pressure ratio pi_n = P_t9 / P_t7, which represents friction losses in the nozzle duct.,\n  subsystem: General,\n  id: 260,\n  physics_domain: FluidDynamics\n}"}}, {"id": "602", "label": "ID_602", "group": "Parameter", "domain": "未分类", "title": "<b>ID_602</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管特性,\n  importance: 0.8,\n  name: Exit momentum thrust,\n  description: An angularity factor (or divergence factor C_ang) accounts for the non-axial exit velocity vector at the nozzle plane, reducing net thrust.,\n  subsystem: General,\n  id: 261,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "603", "label": "ID_603", "group": "Component", "domain": "未分类", "title": "<b>ID_603</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 系统能量,\n  importance: 1.0,\n  name: Available turbine power for compression,\n  description: Extraction of mechanical shaft power (P_TO) to run aircraft accessories directly reduces the turbine power available to drive the compressor.,\n  subsystem: Compression,\n  id: 262,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "604", "label": "ID_604", "group": "Parameter", "domain": "未分类", "title": "<b>ID_604</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统能量,\n  importance: 0.8,\n  name: Core mass flow rate,\n  description: Extracting high-pressure compressed air from the compressor exit for cabin environmental control systems (ECS) or turbine blade cooling reduces the downstream mass flow.,\n  subsystem: General,\n  id: 263,\n  physics_domain: FluidDynamics\n}"}}, {"id": "605", "label": "ID_605", "group": "Component", "domain": "未分类", "title": "<b>ID_605</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 涡轮冷却,\n  importance: 1.0,\n  name: Turbine inlet stagnation temperature,\n  description: Reintroducing relatively cool bleed air into the turbine stages for blade cooling causes aerodynamic mixing losses and lowers the effective total temperature of the gas.,\n  subsystem: Expansion,\n  id: 264,\n  physics_domain: Thermodynamics\n}"}}, {"id": "606", "label": "ID_606", "group": "Parameter", "domain": "未分类", "title": "<b>ID_606</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 真实火箭特性,\n  importance: 0.8,\n  name: Component efficiencies and Chemical reactions,\n  description: Analysis of real rocket engines requires accounting for non-ideal effects including nozzle efficiency, incomplete combustion, heat transfer, and complex chemical behaviors.,\n  subsystem: General,\n  id: 265,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "607", "label": "ID_607", "group": "Parameter", "domain": "未分类", "title": "<b>ID_607</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 推力室特性,\n  importance: 0.8,\n  name: Stagnation pressure at throat,\n  description: Due to high-velocity combustion and friction inside the chamber, the total pressure drops from the injector head to the nozzle throat entrance.,\n  subsystem: General,\n  id: 266,\n  physics_domain: FluidDynamics\n}"}}, {"id": "608", "label": "ID_608", "group": "Component", "domain": "未分类", "title": "<b>ID_608</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 喷管特性,\n  importance: 1.0,\n  name: Nozzle efficiency eta_n,\n  description: Nozzle efficiency eta_n is defined as the ratio of actual kinetic energy change to the ideal isentropic kinetic energy change across the nozzle.,\n  subsystem: Exhaust,\n  id: 267,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "609", "label": "ID_609", "group": "Parameter", "domain": "未分类", "title": "<b>ID_609</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管特性,\n  importance: 0.8,\n  name: Actual exit velocity divided by Isentropic velocity,\n  description: The velocity coefficient C_v relates the actual exhaust velocity to the ideal velocity; typically C_v equals the square root of nozzle efficiency.,\n  subsystem: General,\n  id: 268,\n  physics_domain: FluidDynamics\n}"}}, {"id": "610", "label": "ID_610", "group": "Parameter", "domain": "未分类", "title": "<b>ID_610</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 喷管特性,\n  importance: 0.8,\n  name: Mass flow rate deviation,\n  description: The discharge coefficient C_d is the ratio of actual mass flow rate to the ideal isentropic mass flow rate, accounting for boundary layer displacement.,\n  subsystem: General,\n  id: 269,\n  physics_domain: FluidDynamics\n}"}}, {"id": "611", "label": "ID_611", "group": "Parameter", "domain": "未分类", "title": "<b>ID_611</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧损失,\n  importance: 0.8,\n  name: Chamber stagnation temperature,\n  description: Failure to achieve perfect chemical equilibrium or full mixing of oxidizer and fuel lowers the combustion temperature T_c below its theoretical adiabatic value.,\n  subsystem: General,\n  id: 270,\n  physics_domain: Thermodynamics\n}"}}, {"id": "612", "label": "ID_612", "group": "Parameter", "domain": "未分类", "title": "<b>ID_612</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 燃烧损失,\n  importance: 0.8,\n  name: Characteristic velocity ratio,\n  description: Combustion efficiency is often expressed as the ratio of actual characteristic velocity (c*_actual) to the theoretical characteristic velocity (c*_theoretical).,\n  subsystem: General,\n  id: 271,\n  physics_domain: FluidDynamics\n}"}}, {"id": "613", "label": "ID_613", "group": "Parameter", "domain": "未分类", "title": "<b>ID_613</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Fixed chemical composition,\n  description: Frozen flow assumes that the chemical composition of the exhaust gas remains constant (fixed at chamber exit state) during expansion through the nozzle.,\n  subsystem: General,\n  id: 272,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "614", "label": "ID_614", "group": "Parameter", "domain": "未分类", "title": "<b>ID_614</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Instantaneous chemical reaction,\n  description: Equilibrium flow assumes that chemical reactions occur instantaneously as pressure and temperature drop, continually adjusting composition to maintain local equilibrium.,\n  subsystem: General,\n  id: 273,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "615", "label": "ID_615", "group": "Parameter", "domain": "未分类", "title": "<b>ID_615</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 化学动力学,\n  importance: 0.8,\n  name: Higher specific impulse,\n  description: Equilibrium flow gives higher calculated exhaust velocity and specific impulse than frozen flow because chemical recombination energy is recovered as kinetic energy.,\n  subsystem: General,\n  id: 274,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "616", "label": "ID_616", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_616</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 性能预测,\n  importance: 0.5,\n  name: Frozen flow and Equilibrium flow limits,\n  description: The actual expansion process in a real rocket nozzle falls between the ideal frozen and shifting equilibrium bounds.,\n  subsystem: General,\n  id: 275,\n  physics_domain: FluidDynamics\n}"}}, {"id": "617", "label": "ID_617", "group": "Parameter", "domain": "未分类", "title": "<b>ID_617</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 传热损失,\n  importance: 0.8,\n  name: Exhaust gas enthalpy,\n  description: Heat loss through the chamber walls and nozzle liners directly reduces the thermal energy available for conversion into kinetic energy.,\n  subsystem: Exhaust,\n  id: 276,\n  physics_domain: Thermodynamics\n}"}}, {"id": "618", "label": "ID_618", "group": "Parameter", "domain": "未分类", "title": "<b>ID_618</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 结构与传热,\n  importance: 0.8,\n  name: Fuel through cooling jackets,\n  description: Regenerative cooling pumps the fuel or oxidizer through passages surrounding the thrust chamber wall to absorb heat before injection.,\n  subsystem: General,\n  id: 277,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "619", "label": "ID_619", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_619</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 结构与传热,\n  importance: 0.5,\n  name: Wall heat loss,\n  description: The heat absorbed by the coolant is reintroduced into the combustion chamber, preventing a net thermodynamic energy loss.,\n  subsystem: General,\n  id: 278,\n  physics_domain: Thermodynamics\n}"}}, {"id": "620", "label": "ID_620", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_620</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 结构与传热,\n  importance: 0.5,\n  name: Cooling fluid boundary layer,\n  description: Injecting a small portion of fuel or inert gas along the internal wall creates a protective film that shields the structure from high-temperature core gases.,\n  subsystem: General,\n  id: 279,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "621", "label": "ID_621", "group": "Equation", "domain": "未分类", "title": "<b>ID_621</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 动力循环,\n  importance: 0.6,\n  name: Pressure-fed cycle,\n  description: Liquid rocket engine cycles are classified into pressure-fed systems or pump-fed systems based on how propellants are pressurized.,\n  subsystem: Cycle,\n  id: 280,\n  physics_domain: FluidDynamics\n}"}}, {"id": "354.0", "label": "ID_354.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_354.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 性能指标,\n  importance: 0.5,\n  name: Installed thrust,\n  description: The installed thrust F is equal to the uninstalled thrust F_n minus the inlet drag D_inlet and the nozzle drag D_nozzle.,\n  subsystem: General,\n  id: 13,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "384.0", "label": "ID_384.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_384.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 流动状态,\n  importance: 0.5,\n  name: Choked flow,\n  description: When the Mach number at the throat reaches unity, the mass flow rate through the nozzle reaches its maximum possible value and is said to be choked.,\n  subsystem: General,\n  id: 43,\n  physics_domain: FluidDynamics\n}"}}, {"id": "441.0", "label": "ID_441.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_441.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 燃烧室特性,\n  importance: 0.5,\n  name: Combustor pressure loss,\n  description: The total pressure ratio of the combustor pi_b = P_t4 / P_t3 is always less than 1.0 due to viscous friction and cold-to-hot flow momentum pressure drop.,\n  subsystem: Combustion,\n  id: 100,\n  physics_domain: FluidDynamics\n}"}}, {"id": "443.0", "label": "ID_443.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_443.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 加力燃烧室,\n  importance: 0.5,\n  name: Afterburner pressure loss,\n  description: The total pressure ratio pi_AB = P_t7 / P_t6 account for losses due to flameholders, friction, and high-temperature heat addition.,\n  subsystem: Combustion,\n  id: 102,\n  physics_domain: FluidDynamics\n}"}}, {"id": "488.0", "label": "ID_488.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_488.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 整机匹配,\n  importance: 0.5,\n  name: Choked turbine stator,\n  description: If the high-pressure turbine nozzle guides are choked, the corrected mass flow exiting the compressor remains essentially constant, creating a fixed pumping constraint.,\n  subsystem: Expansion,\n  id: 147,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "490.0", "label": "ID_490.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_490.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 整机匹配,\n  importance: 0.5,\n  name: Choked exhaust nozzle,\n  description: When the convergent exhaust nozzle is choked, the operating pressure ratio across the turbine becomes independent of ambient pressure.,\n  subsystem: Exhaust,\n  id: 149,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "492.0", "label": "ID_492.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_492.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 发动机控制,\n  importance: 0.5,\n  name: Engine limit,\n  description: Mechanical stress restricts the maximum physical or corrected rotational speed of the fan spool.,\n  subsystem: General,\n  id: 151,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "494.0", "label": "ID_494.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_494.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 发动机控制,\n  importance: 0.5,\n  name: Cold day operation,\n  description: At low ambient temperatures (below theta_break), the engine is typically limited by mechanical limits like pressure or spool speed.,\n  subsystem: General,\n  id: 153,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "495.0", "label": "ID_495.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_495.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 发动机控制,\n  importance: 0.5,\n  name: Hot day operation,\n  description: At high ambient temperatures (above theta_break), the engine control reduces fuel flow to protect the turbine from overheating, dropping the thrust.,\n  subsystem: General,\n  id: 154,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "497.0", "label": "ID_497.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_497.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 过渡态,\n  importance: 0.5,\n  name: Transient operation,\n  description: During acceleration, the turbine power must exceed the compressor power to accelerate the spool rotor inertia, causing the operating line to transiently swing toward the stall line.,\n  subsystem: General,\n  id: 156,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "668.0", "label": "ID_668.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_668.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: CrossDomain,\n  importance: 0.5,\n  name: Choked flow condition,\n  description: The throat choking criterion (Chapter 2) becomes the fundamental law regulating component mass flow matching in off-design operation (Chapter 8).,\n  subsystem: General,\n  id: 327,\n  physics_domain: FluidDynamics\n}"}}, {"id": "670.0", "label": "ID_670.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_670.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: CrossDomain,\n  importance: 0.5,\n  name: Turbine material thermal limit,\n  description: The metallurgical temperature limit of turbine blades (Chapter 5) establishes the boundary for the hot-day Theta_break control logic (Chapter 8).,\n  subsystem: Expansion,\n  id: 329,\n  physics_domain: Materials\n}"}}, {"id": "671.0", "label": "ID_671.0", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_671.0</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: CrossDomain,\n  importance: 0.5,\n  name: Afterburner pressure drop,\n  description: The fundamental thermal pressure drop in afterburners (Chapter 5 Rayleigh effect) severely penalizes the real augmented TSFC calculated in Chapter 7.,\n  subsystem: Combustion,\n  id: 330,\n  physics_domain: FluidDynamics\n}"}}, {"id": "622", "label": "ID_622", "group": "Equation", "domain": "未分类", "title": "<b>ID_622</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 动力循环,\n  importance: 0.6,\n  name: Expander cycle,\n  description: A closed cycle where fuel is vaporized in the cooling jacket and then routes directly through the turbine to drive the pumps before entering the injector.,\n  subsystem: Cycle,\n  id: 281,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "623", "label": "ID_623", "group": "Component", "domain": "未分类", "title": "<b>ID_623</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 动力循环,\n  importance: 1.0,\n  name: Turbine inlet temperature,\n  description: The gas generator must operate off-stoichiometric (extremely fuel-rich or oxidizer-rich) to prevent melting the turbine blades.,\n  subsystem: Expansion,\n  id: 282,\n  physics_domain: Thermodynamics\n}"}}, {"id": "624", "label": "ID_624", "group": "Parameter", "domain": "未分类", "title": "<b>ID_624</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 动力循环,\n  importance: 0.8,\n  name: Higher chamber pressure,\n  description: Because the turbine exhaust is injected into the main chamber rather than dumped at low pressure, it allows extremely high chamber pressures (P_c) and higher efficiency.,\n  subsystem: General,\n  id: 283,\n  physics_domain: FluidDynamics\n}"}}, {"id": "625", "label": "ID_625", "group": "Component", "domain": "未分类", "title": "<b>ID_625</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 系统匹配,\n  importance: 1.0,\n  name: Turbine power equals Pump power,\n  description: In steady-state pump-fed cycles, the power produced by the turbine must equal the total mechanical power required to drive the oxidizer and fuel pumps.,\n  subsystem: Expansion,\n  id: 284,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "626", "label": "ID_626", "group": "Parameter", "domain": "未分类", "title": "<b>ID_626</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 系统匹配,\n  importance: 0.8,\n  name: Volumetric flow rate and Pressure rise,\n  description: The required shaft power for a propellant pump is proportional to the mass flow rate and pressure rise, divided by the pump efficiency (eta_p).,\n  subsystem: General,\n  id: 285,\n  physics_domain: FluidDynamics\n}"}}, {"id": "627", "label": "ID_627", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_627</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 真实循环分析,\n  importance: 0.5,\n  name: Component efficiencies and fluid losses,\n  description: Real engine cycle analysis incorporates component efficiencies, pressure losses, mechanical losses, and bleeding to predict realistic performance.,\n  subsystem: General,\n  id: 286,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "628", "label": "ID_628", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_628</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 真实循环分析,\n  importance: 0.5,\n  name: Viscous and shock losses,\n  description: In real engines, component total pressure ratios (like pi_d, pi_b, pi_n) are less than 1.0 due to friction and shock waves.,\n  subsystem: General,\n  id: 287,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "629", "label": "ID_629", "group": "Parameter", "domain": "未分类", "title": "<b>ID_629</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡喷循环,\n  importance: 0.8,\n  name: Real exit velocity and pressure,\n  description: The net thrust of a real turbojet must account for exit velocity variations caused by nozzle efficiency (eta_n) and incomplete expansion.,\n  subsystem: General,\n  id: 288,\n  physics_domain: FluidDynamics\n}"}}, {"id": "630", "label": "ID_630", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_630</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 涡喷循环,\n  importance: 0.5,\n  name: Component irreversibilities,\n  description: Irreversibilities in the compressor and turbine increase entropy, directly decreasing the specific thrust and increasing the TSFC.,\n  subsystem: General,\n  id: 289,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "631", "label": "ID_631", "group": "Equation", "domain": "未分类", "title": "<b>ID_631</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 性能匹配,\n  importance: 0.6,\n  name: Compressor power balance,\n  description: In a real turbojet, the turbine temperature drop is determined by the actual power required to drive the compressor: tau_t = 1 - (tau_lambda / tau_r) * (tau_c - 1) / (eta_m * (1 + f)).,\n  subsystem: Compression,\n  id: 290,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "632", "label": "ID_632", "group": "Equation", "domain": "未分类", "title": "<b>ID_632</b> (Equation)", "properties": {"raw": "{\n  network_level: 3,\n  knowledge_domain: 性能匹配,\n  importance: 0.6,\n  name: Combustor energy balance,\n  description: The actual fuel-air ratio f accounts for combustor efficiency eta_b and variable specific heats across the burner.,\n  subsystem: Combustion,\n  id: 291,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "633", "label": "ID_633", "group": "Parameter", "domain": "未分类", "title": "<b>ID_633</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 加力循环,\n  importance: 0.8,\n  name: Additional fuel injection,\n  description: The afterburner burns remaining oxygen in the turbine exhaust gas, but its efficiency (eta_AB) is lower than the main combustor.,\n  subsystem: General,\n  id: 292,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "634", "label": "ID_634", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_634</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 加力循环,\n  importance: 0.5,\n  name: High total pressure drop,\n  description: Adding heat at a finite Mach number inside the afterburner duct causes a fundamental thermal total pressure drop (Rayleigh effect).,\n  subsystem: General,\n  id: 293,\n  physics_domain: FluidDynamics\n}"}}, {"id": "635", "label": "ID_635", "group": "Parameter", "domain": "未分类", "title": "<b>ID_635</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡扇循环,\n  importance: 0.8,\n  name: Core stream and Bypass stream,\n  description: Real turbofan cycle analysis must track the independent losses and state changes in both the core and the fan bypass duct.,\n  subsystem: General,\n  id: 294,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "636", "label": "ID_636", "group": "Parameter", "domain": "未分类", "title": "<b>ID_636</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡扇循环,\n  importance: 0.8,\n  name: Unmixed turbofan,\n  description: An engine configuration where the core and bypass streams exhaust through separate independent nozzles.,\n  subsystem: General,\n  id: 295,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "637", "label": "ID_637", "group": "Parameter", "domain": "未分类", "title": "<b>ID_637</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡扇循环,\n  importance: 0.8,\n  name: Mixed-flow turbofan,\n  description: An engine configuration where the core and bypass streams mix in a common mixer component before expanding through a single nozzle.,\n  subsystem: General,\n  id: 296,\n  physics_domain: FluidDynamics\n}"}}, {"id": "638", "label": "ID_638", "group": "Component", "domain": "未分类", "title": "<b>ID_638</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 部件匹配,\n  importance: 1.0,\n  name: Equal static pressures at inlet,\n  description: For proper aerodynamic mixing, the core and bypass streams must enter the mixer at substantially equal static pressures (P_5 = P_15).,\n  subsystem: General,\n  id: 297,\n  physics_domain: FluidDynamics\n}"}}, {"id": "639", "label": "ID_639", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_639</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 部件匹配,\n  importance: 0.5,\n  name: Total pressure gain or loss,\n  description: Aerodynamic mixing of streams with different total temperatures and velocities introduces viscous shearing losses, reducing overall total pressure.,\n  subsystem: General,\n  id: 298,\n  physics_domain: FluidDynamics\n}"}}, {"id": "640", "label": "ID_640", "group": "Parameter", "domain": "未分类", "title": "<b>ID_640</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能优化,\n  importance: 0.8,\n  name: Component efficiencies,\n  description: Lower component efficiencies (like lower fan or turbine efficiency) shift the optimum bypass ratio (alpha) toward lower values compared to ideal cycles.,\n  subsystem: General,\n  id: 299,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "641", "label": "ID_641", "group": "Parameter", "domain": "未分类", "title": "<b>ID_641</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能优化,\n  importance: 0.8,\n  name: Specific thrust of turbofan,\n  description: There is a distinct optimum fan pressure ratio (pi_f) that maximizes specific thrust or minimizes TSFC for a given bypass ratio and core technology.,\n  subsystem: General,\n  id: 300,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "642", "label": "ID_642", "group": "Parameter", "domain": "未分类", "title": "<b>ID_642</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 涡桨循环,\n  importance: 0.8,\n  name: Shaft power and Residual thrust,\n  description: A real turboprop splits the available turbine energy into shaft power to drive the propeller and a small amount of jet thrust from the exhaust.,\n  subsystem: General,\n  id: 301,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "643", "label": "ID_643", "group": "Parameter", "domain": "未分类", "title": "<b>ID_643</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Shaft power conversion to thrust,\n  description: The efficiency with which the propeller converts the brake shaft horsepower into effective aircraft propulsive power.,\n  subsystem: General,\n  id: 302,\n  physics_domain: GeneralPhysics\n}"}}, {"id": "644", "label": "ID_644", "group": "Parameter", "domain": "未分类", "title": "<b>ID_644</b> (Parameter)", "properties": {"raw": "{\n  network_level: 2,\n  knowledge_domain: 性能指标,\n  importance: 0.8,\n  name: Fuel flow divided by Equivalent thrust,\n  description: For turboprops, ESFC (or S_e) combines the propeller shaft power and residual jet thrust into a single performance parameter.,\n  subsystem: General,\n  id: 303,\n  physics_domain: FluidDynamics\n}"}}, {"id": "645", "label": "ID_645", "group": "Component", "domain": "未分类", "title": "<b>ID_645</b> (Component)", "properties": {"raw": "{\n  network_level: 1,\n  knowledge_domain: 性能优化,\n  importance: 1.0,\n  name: Optimum nozzle pressure ratio,\n  description: There is an optimum balance between how much expansion occurs in the turbine (for shaft power) versus the exhaust nozzle (for jet thrust) to maximize total equivalent thrust.,\n  subsystem: Exhaust,\n  id: 304,\n  physics_domain: FluidDynamics\n}"}}, {"id": "646", "label": "ID_646", "group": "BoundaryCondition", "domain": "未分类", "title": "<b>ID_646</b> (BoundaryCondition)", "properties": {"raw": "{\n  network_level: 4,\n  knowledge_domain: 损失效应,\n  importance: 0.5,\n  name: Required turbine temperature drop,\n  description: Extracting mechanical power from the shaft forces the turbine to work harder, which reduces the total enthalpy available for the exhaust jet.,\n  subsystem: Expansion,\n  id: 305,\n  physics_domain: Thermo         function initNetwork() {
            const container = document.getElementById('network-canvas');
            
            // 预先载入全量数据
            nodesDataSet.assign(rawNodes);

                    barnesHut: {

                        springLength: 95,

                    }

            network = new vis.Network(container, data, options);

                document.getElementById('loading').style.opacity = '0';

            // 监听节点选择事件以渲染属性侧边栏
            network.on("selectNode", function (params) {
                const selectedId = params.nodes[0];
                const nodeData = nodesDataSet.get(selectedId);
                showNodeDetails(nodeData);

            network.on("deselectNode", function () {
                document.getElementById('placeholder-text').style.display = 'block';

            });
        }

        // 统一级联筛选控制逻辑
        function filterGraph() {
            const searchKeyword = document.getElementById('search-box').value.toLowerCase().strip ? document.getElementById('search-box').value.toLowerCase().trim() : document.getElementById('search-box').value.toLowerCase();
            const targetLabel = document.getElementById('label-filter').value;
            const targetDomain = document.getElementById('domain-filter').value;

            // 基于条件遍历全量节点过滤
            const filteredNodes = rawNodes.filter(node => {
                const matchKeyword = node.label.toLowerCase().includes(searchKeyword);
                const matchLabel = targetLabel === "" || node.group === targetLabel;
                const matchDomain = targetDomain === "" || node.domain === targetDomain;
                return matchKeyword && matchLabel && matchDomain;
            });

            const filteredNodeIds = new Set(filteredNodes.map(n => n.id));

            // 动态保留与之相连的边线，防止产生孤立的无效悬空连线，降低渲染负担
            const filteredEdges = rawEdges.filter(edge => {
                return filteredNodeIds.has(edge.from) && filteredNodeIds.has(edge.to);
            });

            // 刷新图画布
            nodesDataSet.clear();
            edgesDataSet.clear();
            nodesDataSet.add(filteredNodes);
            edgesDataSet.add(filteredEdges);
        }

        // 动态展示底层 KV 属性结构
        function showNodeDetails(node) {
            document.getElementById('placeholder-text').style.display = 'none';
            document.getElementById('details-content').style.display = 'block';
            
            document.getElementById('detail-title').innerText = node.label;
            document.getElementById('detail-group').innerText = "类型: " + node.group;

            const table = document.getElementById('detail-table');
            table.innerHTML = ""; // 清空旧数据

            // 迭代显示嵌套的复杂 JSON 属性
            for (const [key, value] of Object.entries(node.properties)) {
                const row = table.insertRow();
                const cellKey = row.insertCell(0);
                const cellVal = row.insertCell(1);
                cellKey.innerHTML = `<b>${key}</b>`;
                cellVal.innerText = typeof value === 'object' ? JSON.stringify(value) : value;
            }
        }

        // 脚本执行入口
        window.addEventListener('DOMContentLoaded', initNetwork);
    </script>
</body>
</html>
